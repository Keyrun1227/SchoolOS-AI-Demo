<body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">S</div><div><strong>SchoolOS <span style="color:#4ed2cb">AI</span></strong><small>School workflow · assessment to progress</small></div></div><div class="school-pill"><small>DEMO SCHOOL</small><strong>Sunrise State School ▾</strong></div><div class="nav-label">Workspace</div><nav class="nav" id="sideNav"></nav><div class="sidebar-bottom"><div class="demo-tag">◉ &nbsp;Interactive demo mode<br><span style="color:#8fa7bf">Fictional student data · No keys required</span></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" onclick="toast('Use the bottom navigation to move between demo sections.')">☰</button><div class="crumb">SchoolOS <span style="padding:0 7px">/</span> <b id="crumb">Overview</b></div></div><div class="top-actions"><select class="role-select" id="roleSelect" aria-label="Preview role" onchange="setRole(this.value)"><option value="principal">Preview: Principal</option><option value="teacher">Preview: Teacher</option><option value="student">Preview: Student</option><option value="parent">Preview: Parent</option></select><div class="avatar" id="topAvatar">RM</div></div></header><div class="content" id="content"></div></main><nav class="mobile-nav" id="mobileNav"></nav><div class="toast" id="toast"></div></div>
<script>
const students=[{id:'ST-0801',name:'Aarav Reddy',section:'8A',math:86,science:78,english:91,attendance:96,status:'On track'},{id:'ST-0802',name:'Diya Sharma',section:'8A',math:62,science:71,english:84,attendance:93,status:'Needs support'},{id:'ST-0803',name:'Ishaan Kumar',section:'8A',math:48,science:57,english:69,attendance:82,status:'Needs support'},{id:'ST-0804',name:'Meera Patel',section:'8A',math:94,science:89,english:92,attendance:98,status:'On track'},{id:'ST-0805',name:'Kabir Rao',section:'8A',math:73,science:68,english:77,attendance:89,status:'Watch'},{id:'ST-0806',name:'Ananya Das',section:'8A',math:81,science:86,english:88,attendance:97,status:'On track'}];
const navByRole={principal:[['Overview','⌂'],['School performance','▥'],['Teachers','♙'],['Assessments','▣'],['School to-do','✓'],['Reports','▤']],teacher:[['Home','⌂'],['Timetable & plan','◷'],['Assessments','▣'],['My classes','♙'],['Doubt inbox','✉'],['Revision & retests','↻']],student:[['Home','⌂'],['My progress','▥'],['My revision','✦'],['Ask teacher','✉']],parent:[['Child overview','⌂'],['Subjects & results','▤'],['Attendance','◷'],['School updates','♧']]};
let role='principal',page='Overview',marks=students.slice(0,5).map((s,i)=>({id:s.id,name:s.name,q1:[4,3,2,5,3][i],q2:[5,4,3,5,4][i],q3:[3,3,2,4,3][i],q4:[4,3,2,5,4][i],absent:false})),assessment={name:'Unit Test 2 — Mathematics',class:'Class 8 · Section A',date:'2026-10-22',max:20};
function setRole(r){role=r;page=navByRole[r][0][0];document.getElementById('roleSelect').value=r;document.getElementById('topAvatar').textContent={principal:'RM',teacher:'SR',student:'AR',parent:'PR'}[r];render()}
function navRender(){let nav=navByRole[role];document.getElementById('sideNav').innerHTML=nav.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span class="ico">${i}</span>${n}</button>`).join('');document.getElementById('mobileNav').innerHTML=nav.slice(0,4).map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span>${i}</span>${n}</button>`).join('');document.getElementById('crumb').textContent=page}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),3000)}
function head(kicker,title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function stat(label,num,desc,ico,trend=''){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${ico}</span></div><div class="stat-num">${num}</div><div class="${trend?'trend':'muted'}">${trend||desc}</div></div>`}
function card(title,sub,body,action=''){return `<section class="card"><div class="card-head"><div><h2>${title}</h2><p>${sub||''}</p></div>${action}</div>${body}</section>`}
function avatar(name){return name.split(' ').map(x=>x[0]).slice(0,2).join('')}
function studentTable(rows=students){return `<div class="table-wrap"><table><thead><tr><th>Student</th><th>Maths</th><th>Science</th><th>English</th><th>Attendance</th><th>Status</th></tr></thead><tbody>${rows.map(s=>`<tr><td><div class="student"><div class="mini-avatar">${avatar(s.name)}</div><div><b>${s.name}</b><small>${s.id} · ${s.section}</small></div></div></td><td><b>${s.math}%</b></td><td>${s.science}%</td><td>${s.english}%</td><td>${s.attendance}%</td><td><span class="status ${s.status==='On track'?'green':s.status==='Watch'?'blue':'amber'}">${s.status}</span></td></tr>`).join('')}</tbody></table></div>`}
function dashboard(){if(role==='principal')return `${head('SCHOOL OVERVIEW','Good morning, Ravi','Here is what is happening across Sunrise State School today.','<button class="btn" onclick="go(\'Reports\')">↗ View reports</button><button class="btn primary" onclick="go(\'Academics\')">＋ New assessment</button>')}<div class="notice"><b>Demo workspace.</b> All student names, scores and trends are fictional. Use the role switcher to review each experience and share feedback.</div><div class="grid stats">${stat('Students enrolled','486','Across 14 active sections','♙')}${stat('Assessments this term','18','2 need marks entry','▣')}${stat('Students needing support','32','Across 7 subjects','✦')}${stat('Revision & retests completed','74%','This month','✓','↑ 12% from last month')}</div><div class="grid section-grid">${card('Recent assessments','Track marking progress and class results','<div class="table-wrap"><table><thead><tr><th>Assessment</th><th>Class</th><th>Avg. score</th><th>Progress</th><th></th></tr></thead><tbody><tr><td><b>Unit Test 2 — Maths</b><div class="muted" style="font-size:10px;margin-top:4px">22 Oct · Unit test</div></td><td>8A</td><td><b>68%</b></td><td><span class="status amber">Marking</span></td><td><button class="link" onclick="go(\'Academics\')">Open →</button></td></tr><tr><td><b>FA2 — Science</b><div class="muted" style="font-size:10px;margin-top:4px">18 Oct · Formative</div></td><td>7A</td><td><b>74%</b></td><td><span class="status green">Reviewed</span></td><td><button class="link" onclick="go(\'Reports\')">View →</button></td></tr><tr><td><b>Chapter Test — English</b><div class="muted" style="font-size:10px;margin-top:4px">16 Oct · Chapter 5</div></td><td>8B</td><td><b>81%</b></td><td><span class="status green">Complete</span></td><td><button class="link" onclick="go(\'Reports\')">View →</button></td></tr></tbody></table></div>','<button class="link" onclick="go(\'Academics\')">All assessments →</button>')}${card('Needs attention','Prioritie function createAssessment(){return `${head('ASSESSMENT STUDIO · STEP 1 OF 4','Create an assessment','Set the basics first. You can review every question before creating the final paper.','<button class="btn" onclick="go(\'Assessments\')">← Back to assessments</button>')}<div class="workflow"><div class="step current"><span class="num">1</span><div><b>Assessment details</b><small>Class and syllabus</small></div></div><div class="step"><span class="num">2</span><div><b>Paper source</b><small>Generate or use paper</small></div></div><div class="step"><span class="num">3</span><div><b>Review questions</b><small>Check marks and topics</small></div></div><div class="step"><span class="num">4</span><div><b>Print and assess</b><small>Prepare exam pack</small></div></div></div><div class="card"><div class="card-head"><div><h2>Assessment details</h2><p>Tell SchoolOS what students are being assessed on.</p></div><span class="status blue">Step 1 of 4</span></div><div class="form-grid"><div class="form-group"><label>Assessment name</label><input class="field" id="assName" value="Unit Test 2 — Mathematics"></div><div class="form-group"><label>Assessment type</label><select class="field" id="assType"><option>Unit test</option><option>FA / formative assessment</option><option>SA / summative assessment</option><option>Chapter test</option><option>Revision test</option></select></div><div class="form-group"><label>Class and section</label><select class="field" id="assClass"><option>Class 8 · Section A</option><option>Class 8 · Section B</option><option>Class 7 · Section A</option><option>Class 9 · Section A</option></select></div><div class="form-group"><label>Subject</label><select class="field" id="assSubject"><option>Mathematics</option><option>Science</option><option>English</option><option>Social Studies</option><option>Telugu</option></select></div><div class="form-group"><label>Exam date</label><input type="date" class="field" id="assDate" value="2026-10-22"></div><div class="form-group"><label>Total marks</label><select class="field" id="assMarks"><option>20</option><option>10</option><option>25</option><option>40</option><option>50</option><option>80</option><option>100</option></select></div><div class="form-group full"><label>Chapters or topics</label><input class="field" id="assTopics" value="Fractions, Decimals and Rational Numbers"><small>Use one topic for a short test or multiple chapters for unit, quarterly or half-yearly exams.</small></div><div class="form-group full"><label>Choose the paper source</label><div class="choice-grid"><label class="choice selected"><input type="radio" name="source" value="generate" checked><div><b>Generate a new paper</b><p>Create questions, answer key and topic mapping. Demo mode uses sample content; real AI requires a configured API key.</p></div></label><label class="choice"><input type="radio" name="source" value="upload"><div><b>Use an existing paper</b><p>For a school paper or state-provided question paper. Upload and extraction are preview-only in this demo.</p></div></label></div></div></div><div style="display:flex;justify-content:flex-end;margin-top:22px"><button class="btn primary" onclick="makePaper()">Continue to paper review →</button></div></div>`}
function makePaper(){assessment.name=document.getElementById('assName').value||'New assessment';assessment.class=document.getElementById('assClass').value;assessment.date=document.getElementById('assDate').value;assessment.max=Number(document.getElementById('assMarks').value);let source=document.querySelector('input[name=source]:checked').value;go('Review questions');toast(source==='upload'?'Demo preview opened. File extraction is not enabled in this UI-only demo.':'Sample question paper created for UI review.')}
function reviewQuestions(){let qs=[['Q1','Simplify 3/4 + 1/8.','Fractions',4],['Q2','Write 0.75 as a fraction in simplest form.','Decimals',4],['Q3','Arrange 2/3, 1/2 and 3/4 in ascending order.','Fractions',4],['Q4','A ribbon is 2.5 m long. 0.75 m is used. How much remains?','Decimals',4],['Q5','Explain one method to compare two rational numbers.','Rational numbers',4]];return `${head('ASSESSMENT STUDIO · STEP 3 OF 4','Review questions','Review the sample paper, marks and topic mapping before finalising.','<button class="btn" onclick="go(\'Create assessment\')">← Edit details</button>')}<div class="notice"><b>Sample content.</b> These are illustrative questions for checking the UI flow. Review and approve all generated or extracted content before using it in a real exam.</div><div class="grid section-grid"><div class="card"><div class="card-head"><div><h2>${assessment.name}</h2><p>${assessment.class} · ${assessment.date} · Draft</p></div><span class="status blue">Needs review</span></div>${qs.map((q,i)=>`<div class="question"><div class="q-title"><div><b>${q[0]}. ${q[1]}</b><div class="q-meta"><span class="chip">${q[2]}</span> &nbsp;Learning outcome mapping: review needed</div></div><label style="display:flex;align-items:center;gap:7px;font-size:11px">Marks <input class="mark-input" type="number" min="0" step="0.5" value="${q[3]}" id="qmark${i}"></label></div></div>`).join('')}<div style="display:flex;justify-content:space-between;align-items:center;padding-top:16px"><span class="muted" style="font-size:12px">Target total: ${assessment.max} marks</span><button class="btn primary" onclick="finalisePaper()">Approve sample paper →</button></div></div>${card('Exam pack preview','What your teacher will prepare',`<div class="priority-list"><div class="priority"><div class="priority-icon">▤</div><div><b>Student question paper</b><p>Printable paper with instructions and marks per question.</p></div></div><div class="priority"><div class="priority-icon">✓</div><div><b>Teach function finalisePaper(){let total=[0,1,2,3,4].reduce((a,i)=>a+Number(document.getElementById('qmark'+i).value||0),0);if(total!==assessment.max){toast('Question marks total '+total+'. Adjust marks to match the '+assessment.max+'-mark assessment.');return}marks=students.slice(0,5).map((s,i)=>({id:s.id,name:s.name,q1:[4,3,2,5,3][i],q2:[5,4,3,5,4][i],q3:[3,3,2,4,3][i],q4:[4,3,2,5,4][i],absent:false}));go('Marks register');toast('Paper approved in this demo. You can now test marks entry.')}
function marksRegister(){return `${head('ASSESSMENT WORKFLOW · STEP 4','Marks register','Enter marks from the teacher-marked written papers. Missing marks and absence are different states.','<button class="btn" onclick="go(\'Assessments\')">← Assessments</button><button class="btn primary" onclick="confirmMarks()">✓ Validate and confirm</button>')}<div class="notice"><b>${assessment.name}</b> · ${assessment.class} · Max ${assessment.max} marks. This register contains fictional students. Changes stay in this browser demo only.</div><div class="toolbar"><input class="field" id="markSearch" placeholder="Search student name or ID" oninput="filterMarks()"><select class="field" id="markView" onchange="filterMarks()"><option value="all">All students</option><option value="support">Needs support</option><option value="absent">Absent</option></select><button class="btn" onclick="addHalfMark()">+ Add 0.5 test</button><span class="muted" style="margin-left:auto;font-size:12px">Marks can be decimals</span></div><div class="card"><div class="table-wrap"><table class="mark-table" id="marksTable"><thead><tr><th>Student</th><th>Q1 · /5</th><th>Q2 · /5</th><th>Q3 · /5</th><th>Q4 · /5</th><th>Total /20</th><th>Attendance</th></tr></thead><tbody>${marks.map((m,i)=>markRow(m,i)).join('')}</tbody></table></div><div style="display:flex;justify-content:space-between;align-items:center;padding-top:17px;border-top:1px solid var(--line);margin-top:10px"><div><b id="markCount">${marks.length} students shown</b><div class="muted" style="font-size:11px;margin-top:4px">AB = absent · Blank = not entered yet</div></div><button class="btn primary" onclick="confirmMarks()">Validate marks →</button></div></div>`}
function markRow(m,i){let total=m.absent?'AB':m.q1+m.q2+m.q3+m.q4;return `<tr data-name="${m.name.toLowerCase()}" data-id="${m.id}" data-support="${!m.absent&&Number(total)<12}" data-absent="${m.absent}"><td><div class="student"><div class="mini-avatar">${avatar(m.name)}</div><div><b>${m.name}</b><small>${m.id}</small></div></div></td>${['q1','q2','q3','q4'].map(q=>`<td><input class="field" type="number" min="0" max="5" step="0.5" value="${m.absent?'':m[q]}" ${m.absent?'disabled':''} onchange="updateMark(${i},'${q}',this.value)" aria-label="${q} marks for ${m.name}"></td>`).join('')}<td class="mark-total" id="total${i}">${total}</td><td><select class="field" style="width:94px" onchange="setAbsent(${i},this.value)"><option value="present" ${!m.absent?'selected':''}>Present</option><option value="absent" ${m.absent?'selected':''}>Absent (AB)</option></select></td></tr>`}
function updateMark(i,q,v){if(v===''||Number(v)<0||Number(v)>5||Number(v)*2%1!==0){toast('Enter a mark from 0 to 5 in increments of 0.5.');render();return}marks[i][q]=Number(v);document.getElementById('total'+i).textContent=marks[i].q1+marks[i].q2+marks[i].q3+marks[i].q4;}
function setAbsent(i,v){marks[i].absent=v==='absent';render();toast(marks[i].absent?'Student marked absent (AB).':'Student marked present.')}
function filterMarks(){let search=(document.getElementById('markSearch')?.value||'').toLowerCase(),view=document.getElementById('markView')?.value||'all',rows=[...document.querySelectorAll('#marksTable tbody tr')],count=0;rows.forEach(r=>{let show=(r.dataset.name.includes(search)||r.dataset.id.toLowerCase().includes(search))&&(view==='all'||(view==='support'&&r.dataset.support==='true')||(view==='absent'&&r.dataset.absent==='true'));r.style.display=show?'':'none';if(show)count++});let c=document.getElementById('markCount');if(c)c.textContent=count+' students shown'}
function addHalfMark(){let i=marks.findIndex(m=>!m.absent);if(i<0){toast('No present students in this demo register.');return}marks[i].q1=Math.max(0,marks[i].q1-.5);render();toast('Added a half-mark example. Check the first student’s Q1 value.')}
function confirmMarks(){let invalid=marks.find(m=>!m.absent&&[m.q1,m.q2,m.q3,m.q4].some(x=>x===undefined||x===null||x<0||x>5));if(invalid){toast('Some marks are missing or outside the allowed range.');return}toast('Validation passed in demo mode. Results and learning insights are ready to review.');go(role==='teacher'?'Revision & retests':'Reports')}

>Open</span></div><div class="task"><input type="checkbox" onchange="taskDone(this)"><div><b>Retest: decimals</b><p>5 students · Due 20 Oct · Planned</p></div><span class="status blue">Planned</span></div><div class="task"><input type="checkbox" checked onchange="taskDone(this)"><div><b>Review science corrections</b><p>6 students · Completed 14 Oct</p></div><span class="status green">Done</span></div></div>`)}</div>`}
function newTask(){let name=prompt('Enter a short name for the support task:','Fractions revision — Group A');if(name)assignTask(name)}function assignTask(name){let list=document.getElementById('taskList');if(list){let el=document.createElement('div');el.className='task';el.innerHTML=`<input type="checkbox" onchange="taskDone(this)"><div><b>${escapeHtml(name)}</b><p>Demo class · Due in 3 days · Newly assigned</p></div><span class="status amber">Open</span>`;list.prepend(el)}else toast('“'+name+'” is ready for teacher review in this demo.');toast('Support task added in demo mode.')}

function addPrincipalTask(){let input=document.getElementById('newPrincipalTask');if(!input||!input.value.trim()){toast('Enter a task first.');return}let tasks=[];try{tasks=JSON.parse(localStorage.getItem('schoolos_principal_tasks')||'[]')}catch(e){}tasks.unshift({text:input.value.trim(),owner:document.getElementById('principalOwner').value,due:document.getElementById('principalDue').value||'Not set',done:false});try{localStorage.setItem('schoolos_principal_tasks',JSON.stringify(tasks))}catch(e){}go('School to-do');toast('School task added.')}
function togglePrincipalTask(index,done){let tasks=[];try{tasks=JSON.parse(localStorage.getItem('schoolos_principal_tasks')||'[]')}catch(e){}if(!tasks.length)tasks=[{text:'Review Class 8 term-wise performance',owner:'Myself',due:'2026-10-20',done:false},{text:'Follow up on attendance below 75%',owner:'Class coordinator',due:'2026-10-21',done:false},{text:'Confirm two pending marks registers',owner:'Class teacher',due:'2026-10-16',done:true}];if(tasks[index])tasks[index].done=done;try{localStorage.setItem('schoolos_principal_tasks',JSON.stringify(tasks))}catch(e){}go('School to-do')}

function createAssessment(){let cls=role==='teacher'?['Class 8 · Section A','Class 9 · Section A','Class 10 · Section B']:['Class 8 · Section A','Class 8 · Section B','Class 7 · Section A','Class 9 · Section A'];let subj=role==='teacher'?'Science':'Mathematics';return `${head('ASSESSMENT STUDIO · STEP 1 OF 4','Create an assessment','Choose a class you teach, select topics, and review the paper before printing.','<button class="btn" onclick="go(\'Assessments\')">← Back to assessments</button>')}<div class="workflow"><div class="step current"><span class="num">1</span><div><b>Assessment details</b><small>Class and syllabus</small></div></div><div class="step"><span class="num">2</span><div><b>Paper source</b><small>Generate or use paper</small></div></div><div class="step"><span class="num">3</span><div><b>Review questions</b><small>Check marks and topics</small></div></div><div class="step"><span class="num">4</span><div><b>Print and assess</b><small>Prepare exam pack</small></div></div></div><div class="card"><div class="card-head"><div><h2>Assessment details</h2><p>${role==='teacher'?'Your subject is locked to Science and classes are limited to your assignment.':'Set the subject, class and topics for this assessment.'}</p></div><span class="status blue">Step 1 of 4</span></div><div class="form-grid"><div class="form-group"><label>Assessment name</label><input class="field" id="assName" value="${subj==='Science'?'Unit Test — Science':'Unit Test 2 — Mathematics'}"></div><div class="form-group"><label>Assessment type</label><select class="field" id="assType"><option>Unit test</option><option>FA / formative assessment</option><option>SA / summative assessment</option><option>Chapter test</option><option>Revision test</option></select></div><div class="form-group"><label>Class and section</label><select class="field" id="assClass">${cls.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="form-group"><label>Subject</label>${role==='teacher'?'<input class="field" id="assSubject" value="Science" readonly><small>Your assigned subject cannot be changed.</small>':`<select class="field" id="assSubject"><option>Mathematics</option><option>Science</option><option>English</option><option>Social Studies</option><option>Telugu</option></select>`}</div><div class="form-group"><label>Exam date</label><input type="date" class="field" id="assDate" value="2026-10-22"></div><div class="form-group"><label>Total marks</label><select class="field" id="assMarks"><option>20</option><option>10</option><option>25</option><option>40</option><option>50</option><option>80</option><option>100</option></select></div><div class="form-group full"><label>Chapters or topics</label><input class="field" id="assTopics" value="${subj==='Science'?'Separation of Substances and Materials':'Fractions, Decimals and Rational Numbers'}"><small>One topic for a short test or multiple chapters for unit, quarterly or half-yearly exams.</small></div><div class="form-group full"><label>Choose the paper source</label><div class="choice-grid"><label class="choice selected"><input type="radio" name="source" value="generate" checked><div><b>Generate a new paper</b><p>Draft questions, answer key and topic mapping. Demo content is sample only; real AI needs an API key.</p></div></label><label class="choice"><input type="radio" name="source" value="upload"><div><b>Use an existing paper</b><p>For a school or state-provided paper. Upload/extraction is not connected in this prototype.</p></div></label></div></div></div><div style="display:flex;justify-content:flex-end;margin-top:22px"><button class="btn primary" onclick="makePaper()">Continue to paper review →</button></div></div>`}
function reviewQuestions(){let science=role==='teacher';let qs=science?[['Q1','Name two methods used to separate mixtures.','Separation of substances',4],['Q2','Explain filtration with one example.','Separation of substances',4],['Q3','Why can evaporation separate salt from water?','Evaporation',4],['Q4','Choose a suitable method to separate iron filings from sand.','Magnetic separation',4],['Q5','Describe one safety rule during a heating experiment.','Lab safety',4]]:[['Q1','Simplify 3/4 + 1/8.','Fractions',4],['Q2','Write 0.75 as a fraction in simplest form.','Decimals',4],['Q3','Arrange 2/3, 1/2 and 3/4 in ascending order.','Fractions',4],['Q4','A ribbon is 2.5 m long. 0.75 m is used. How much remains?','Decimals',4],['Q5','Explain one method to compare two rational numbers.','Rational numbers',4]];return `${head('ASSESSMENT STUDIO · STEP 3 OF 4','Review questions','Check question wording, marks and topic mapping. Approve only after you are satisfied.','<button class="btn" onclick="go(\'Create assessment\')">← Edit details</button>')}<div class="notice"><b>Sample content.</b> Review all questions and answer guidance before using a paper in a real exam.</div><div class="grid section-grid"><div class="card"><div class="card-head"><div><h2>${assessment.name}</h2><p>${assessment.class} · ${assessment.date} · ${science?'Science':'Mathematics'} · Draft</p></div><span class="status blue">Needs review</span></div>${qs.map((q,i)=>`<div class="question"><div class="q-title"><div><b>${q[0]}. ${q[1]}</b><div class="q-meta"><span class="chip">${q[2]}</span> &nbsp;Learning outcome: review required</div></div><label style="display:flex;align-items:center;gap:7px;font-size:11px">Marks <input class="mark-input" type="number" min="0" step="0.5" value="${q[3]}" id="qmark${i}"></label></div></div>`).join('')}<div style="display:flex;justify-content:space-between;align-items:center;padding-top:16px"><span class="muted" style="font-size:12px">Target total: ${assessment.max} marks</span><button class="btn primary" onclick="finalisePaper()">Approve sample paper →</button></div></div>${card('Exam pack','What you prepare',`<div class="priority-list"><div class="priority"><div class="priority-icon">▤</div><div><b>Student question paper</b><p>Printable paper with instructions and marks.</p></div></div><div class="priority"><div class="priority-icon">✓</div><div><b>Teacher answer key</b><p>Suggested answers and marking guidance.</p></div></div><div class="priority"><div class="priority-icon">▦</div><div><b>Marks register</b><p>Question-wise marks, absence status and totals.</p></div></div></div>`)}</div>`}
function assessments(){if(role==='teacher')return `${head('ASSESSMENT STUDIO','My Science assessments','Only Science assessments for your assigned classes are listed here.','<button class="btn primary" onclick="go(\'Create assessment\')">＋ Create Science assessment</button>')}<div class="notice"><b>Your assignment:</b> Science · Classes 8A, 9A and 10B. Other subjects and classes are not available in this teacher workspace.</div><div class="grid stats">${stat('Drafts','1','Ready to continue','▣')}${stat('Awaiting marks','2','Science assessments','✎')}${stat('Reviewed','8','This term','✓')}${stat('Retests to review','2','Science follow-up','↻')}</div>${card('Your recent assessments','Continue the work for your assigned classes',`<div class="table-wrap"><table><thead><tr><th>Assessment</th><th>Class</th><th>Date</th><th>Marks</th><th>Progress</th><th></th></tr></thead><tbody><tr><td><b>FA2 — Science</b><small class="muted" style="display:block;margin-top:4px">Materials · Separation</small></td><td>9A</td><td>18 Oct 2026</td><td>25</td><td><span class="status amber">Marking</span></td><td><button class="btn small primary" onclick="assessment={name:'FA2 — Science',class:'Class 9 · Section A',date:'2026-10-18',max:25};go('Marks register')">Enter marks</button></td></tr><tr><td><b>Chapter Test — Science</b><small class="muted" style="display:block;margin-top:4px">Tissues</small></td><td>9A</td><td>12 Oct 2026</td><td>20</td><td><span class="status green">Reviewed</span></td><td><button class="link" onclick="toast('Demo results opened.')">View →</button></td></tr><tr><td><b>Unit Test — Science</b><small class="muted" style="display:block;margin-top:4px">Electricity</small></td><td>10B</td><td>09 Oct 2026</td><td>40</td><td><span class="status green">Complete</span></td><td><button class="link" onclick="toast('Demo results opened.')">View →</button></td></tr></tbody></table></div>`)}${card('Assessment workflow','The usual school process, made easier',`<div class="workflow"><div class="step done"><span class="num">1</span><div><b>Create or use paper</b><small>Science only</small></div></div><div class="step done"><span class="num">2</span><div><b>Review questions</b><small>Approve content</small></div></div><div class="step current"><span class="num">3</span><div><b>Enter marks</b><small>From written papers</small></div></div><div class="step"><span class="num">4</span><div><b>Review progress</b><small>Topics and retest</small></div></div></div>`)}`;return `${head('SCHOOL ASSESSMENTS','Assessment overview','Review planned assessments, marking status and published class results.')}<div class="grid stats">${stat('Planned','21','Across Classes 6–10','▣')}${stat('Completed','18','This term','✓')}${stat('Awaiting marks','2','Follow up with class teachers','✎')}${stat('Results published','16','Available to linked parents/students','↗')}</div>${card('Recent school assessments','Click into a class result or marking status',`<div class="table-wrap"><table><thead><tr><th>Assessment</th><th>Class</th><th>Subject</th><th>Average</th><th>Status</th><th></th></tr></thead><tbody><tr><td><b>Unit Test 2</b></td><td>8A</td><td>Mathematics</td><td>68%</td><td><span class="status amber">Marking</span></td><td><button class="link" onclick="go('School performance')">Review →</button></td></tr><tr><td><b>FA2</b></td><td>9A</td><td>Science</td><td>74%</td><td><span class="status green">Reviewed</span></td><td><button class="link" onclick="go('School performance')">Review →</button></td></tr><tr><td><b>Chapter Test</b></td><td>8B</td><td>English</td><td>81%</td><td><span class="status green">Published</span></td><td><button class="link" onclick="go('School performance')">Review →</button></td></tr></tbody></table></div>`)}`}
function render(){navRender();let html='';if(['Overview','Home','My home','Child overview'].includes(page))html=dashboard();else if(page==='School performance'||page==='Academics')html=schoolPerformance();else if(page==='Teachers')html=teachersPage();else if(page==='School to-do')html=principalTasks();else if(page==='Timetable & plan')html=timetablePlan();else if(page==='Assessments')html=assessments();else if(page==='Create assessment')html=createAssessment();else if(page==='Review questions')html=reviewQuestions();else if(page==='Marks register')html=marksRegister();else if(['My classes','Students'].includes(page))html=simpleStudents();else if(page==='Revision & retests')html=revisionPage();else if(page==='My revision'||page==='Revision')html=studentRevision();else if(page==='My progress'||page==='Reports')html=reports();else if(page==='Subjects & results')html=reports();else if(page==='Attendance')html=attendancePage();else if(page==='School updates'||page==='Updates')html=updates();else if(page==='Doubt inbox'||page==='Ask teacher')html=doubtInbox();else html=dashboard();document.getElementById('content').innerHTML=html;document.getElementById('crumb').textContent=page;}

render();
</script></body></html>
