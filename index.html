function studentDetailPage(){const s=student(selectedStudent);if(!s)return '<div class="empty">Student not found.</div>';const scores=studentScore(s.id);const interventions=db.interventions.filter(i=>i.student===s.id);const open=interventions.filter(i=>i.status!=='completed').length;return `${pageHead('STUDENT PROFILE',esc(s.name),`${s.class} · ${s.id} · Subject-level evidence and recorded support history.`,`<button class="btn" onclick="go('students')">← Students</button><button class="btn primary" onclick="newIntervention('${s.id}')">＋ Assign support</button>`)}<div class="profile-hero"><div class="profile-avatar">${initials(s.name)}</div><div style="flex:1"><h2>${esc(s.name)}</h2><p>${esc(s.class)} · Parent/guardian label: ${esc(s.parent)} · fictional record</p><div class="pill-list"><span class="tag ${s.attendance<80?'red':'teal'}">Attendance ${s.attendance}%</span><span class="tag">${scores.length} recorded assessment results</span><span class="tag ${open?'amber':'green'}">${open} open interventions</span></div></div></div><div class="grid stats">${stat('Latest score',scores[0]?scores[0].pct+'%':'—',scores[0]?.a.name||'No score recorded','▤')}${stat('Previous score',scores[1]?scores[1].pct+'%':'—',scores[1]?.a.name||'No comparison','↔','teal')}${stat('Change',scores.length>1?((scores[0].pct-scores[1].pct)>0?'+':'')+(scores[0].pct-scores[1].pct)+' pts':'—','Latest vs previous','↗',scores.length>1&&scores[0].pct<scores[1].pct?'red':'teal')}${stat('Support actions',interventions.length,'Recorded intervention history','✓','amber')}</div><div class="grid cols2"><div>${panel('Assessment history','Use comparable assessments and consider changes in difficulty.',scores.map(x=>`<div class="row"><div class="row-main"><strong>${esc(x.a.name)}</strong><span>${fmtDate(x.a.date)} · ${x.m.score}/${x.a.max} marks</span></div><strong>${x.pct}%</strong></div>`).join('')||'<div class="empty">No assessment results.</div>')}${panel('Teacher notes & context','Notes are factual prompts e="margin-bottom:10px">Recent activity: ${esc(t.recent)}</div><div class="callout" style="margin-bottom:12px"><strong>Support / context</strong><br>${esc(t.support)}</div><button class="btn primary" style="width:100%" onclick="openTeacher('${t.id}')">Open full profile →</button></article>`).join('')}</div><div class="callout" style="margin-top:16px"><strong>Fairness guardrail</strong><br>These are workflow indicators, not teacher-performance ratings. Student results must be interpreted alongside attendance, syllabus coverage, assessment comparability and the support available. No automatic teacher ranking is produced.</div>`}
function teacherProfilePage(){const t=teacher(selectedTeacher);if(!t)return '<div class="empty">Teacher not found.</div>';const ownAssess=db.assessments.filter(a=>a.teacher===t.id);const interventions=db.interventions.filter(i=>i.teacher===t.id);const pending=ownAssess.filter(a=>a.status!=='published');const supportItems=interventions.filter(i=>i.status!=='completed');const tab=teacherTab;let body='';if(tab==='overview')body=`<div class="grid stats">${stat('Assessments complete',t.assessmentsDone+'/'+t.assessmentsTotal,'Recorded workflow status','▤',t.assessmentsDone===t.assessmentsTotal?'teal':'amber')}${stat('Marking recorded',t.marking+'%','Based on demo records','✓','teal')}${stat('Students for follow-up',t.followups,'Requires case review, not a judgement','♙','amber')}${stat('Retests with recorded change',interventions.filter(i=>i.retest!==null).length,'Intervention evidence available','↗','blue')}</div><div class="grid cols2"><div>${panel('Assigned classes & subjects', 'Current teaching allocation',`<div class="pill-list">${t.subjects.map(s=>`<span class="tag teal">${esc(s)}</span>`).join('')}${t.classes.map(c=>`<span class="tag">Class ${esc(c)}</span>`).join('')}</div><div class="kpi-note">♙ <span>${t.students} assigned students across the recorded classes. Allocation is illustrative.</span></div>`)}${panel('Assessment work','What is completed and what remains',ownAssess.map(a=>`<div class="row"><div class="row-main"><strong>${esc(a.name)}</strong><span>${esc(a.class)} · ${fmtDate(a.date)} · ${a.marks.length} marks rows</span></div><span class="tag ${a.status==='published'?'green':'amber'}">${a.status}</span><button class="btn sm" onclick="openAssessment('${a.id}')">View</button></div>`).join('')||'<div class="empty">No assessments assigned in the sample.</div>')}</div><div>${panel('Student progress evidence','Latest published results linked to assigned subject',db.students.filter(s=>s.subjects.some(sub=>t.subjects.includes(sub))).map(s=>{const ss=studentScor  class="btn" onclick="go('teachers')">← Teachers</button><button class="btn" onclick="exportTeacher('${t.id}')">⇩ Export</button>`)}<div class="profile-hero"><div class="profile-avatar">${initials(t.name)}</div><div style="flex:1"><h2>${esc(t.name)}</h2><p>${esc(t.email)} · ${esc(t.subjects.join(', '))} · Classes ${esc(t.classes.join(', '))}</p><div class="pill-list"><span class="tag teal">${t.students} assigned students</span><span class="tag ${pending.length?'amber':'green'}">${pending.length} assessments needing review</span><span class="tag">No teacher score assigned</span></div></div><div class="profile-actions"><button class="btn sm" onclick="newIntervention(null,'${t.id}')">＋ Assign intervention</button><button class="btn sm" onclick="newAssessment('${t.id}')">＋ Assessment</button></div></div><div class="tabs">${[['overview','Overview'],['assessments','Assessment work'],['students','Student progress'],['context','Context & support']].map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="teacherTab='${id}';render()">${label}</button>`).join('')}</div>${body}<div class="callout"><strong>How to interpret this profile</strong><br>It answers what work is recorded, which students need follow-up, what progress evidence exists and what support may be needed. It does not claim that outcomes are caused by the teacher.</div>`}

function learningPage(){const topicStats=[{topic:'Fractions & equivalent fractions',score:43,students:['S003','S006'],action:'Revisit equivalent fractions and visual models.'},{topic:'Multi-step calculations',score:58,students:['S006','S008'],action:'Model the order of steps and ask students to explain reasoning.'},{topic:'Decimals & conversion',score:62,students:['S008'],action:'Short guided practice with conversion examples.'},{topic:'Science: explaining evidence',score:68,students:['S003','S006'],action:'Use sentence starters and evidence sorting.'}];return `${pageHead('LEARNING ANALYTICS','Learning gaps','See concepts that need reteaching, the students affected and the evidence behind each signal.')}${panel('Concepts needing attention','Sample topic-level estimates. Validate against mapped questions and sufficient records before taking action.',topicStats.map(t=>`<div class="row"><div class="row-main"><strong>${esc(t.topic)}</strong><span>${t.students.length} students flagged for review · sample mapping</span><div class="progress red" style="margin-top:7px"><span style="width:${t.score}%"></span></div></div><strong>${t.score}%</strong><button class="btn sm" onclick="topicAction('${encodeURIComponent(t.topic)}','${encodeURIComponent(t.action)}','${t.students.join(',')}')">Review</button></div>`).join(''))}<div class="grid cols2">${panel('Students with declining results','Latest vs previous assessment',fallingStudents().map(s=>`<div class="row"><div class="row-main"><strong>${esc(s.name)}</strong><span>${s.scores[1].pct}% → ${s.scores[0].pct}% · ${esc(s.scores[0].a.subject)}</span></div><button class="btn sm" onclick="openStudent('${s.id}')">Open</button></div>`).join('')||'<div class="empty">No declines found in available records.</div>')}${panel('Interpretation checklist','Before assigning intervention',`<div class="checkline"><input type="checkbox"><span>Confirm the questions are mapped to the correct topic.</span></div><div class="checkline"><input type="checkbox"><span>Compare assessment difficulty and maximum marks.</span></div><div class="checkline"><input type="checkbox"><span>Review attendance and lessons missed.</span></div><div class="checkline"><input type="checkbox"><span>Ask the teacher to confirm the gap before parent communication.</span></div>`)}</div>`}
function interventionsPage(){const arr=db.interventions.filter(i=>isPrincipal()||i.teacher===session.id);return `${pageHead('INTERVENTION TRACKING','Interventions & retests','Record what was assigned, whether it happened, and what the follow-up assessment showed.',`<button class="btn primary" onclick="newIntervention()">＋ Assign intervention</button>`)}<div class="grid stats">${stat('Open interventions',arr.filter(i=>i.status!=='completed').length,'Assigned or in progress','↗','amber')}${stat('Completed',arr.filter(i=>i.status==='completed').length,'Marked completed','✓','teal')}${stat('Retest evidence',arr.filter(i=>i.retest!==null).length,'Retest score recorded','▤')}${stat('Improved after retest',arr.filter(i=>i.retest!==null&&i.retest>i.baseline).length,'Baseline compared with retest','↑','teal')}</div>${panel('Intervention register','A completed intervention does not automatically prove causation; review timing, attendance and assessment comparability.',`<div class="table-wrap"><table><thead><tr><th>Student</th><th>Learning gap</th><th>Assigned to</th><th>Due date</th><th>Status</th><th>Baseline → retest</th><th></th></tr></thead><tbody>${arr.map(i=>`<tr><td><strong>${esc(subjectFor(i.student))}</strong><div class="small muted">${esc(i.student)}</div></td><td>${esc(i.topic)}</td><td>${esc(nameFor(i.teacher))}</td><td>${fmtDate(i.due)}</td><td><span class="tag ${i.status==='completed'?'green':i.status==='in_progress'?'blue':'amber'}">${i.status.replace('_',' ')}</span></td><td>${i.baseline}% → ${i.retest===null?'Not recorded':i.retest+'%'} ${i.retest!==null?`<span class="delta ${i.retest>=i.baseline?'up':'down'}">${i.retest-i.baseline>=0?'+':''}${i.retest-i.baseline}</span>`:''}</td><td><button class="table-action" onclick="openIntervention('${i.id}')">Open →</button></td></tr>`).join('')}</tbody></table></div>`)}`}
function reportsPage(){return `${pageHead('REPORTING','Reports & exports','Prepare printable, evidence-based summaries for principals, teachers and parent meetings.') }<div class="grid cols2">${panel('Principal reports','School-wide review',`<div class="row"><div class="row-main"><strong>Academic overview</strong><span>Assessment counts, average recorded scores and open actions.</span></div><button class="btn sm" onclick="printReport('overview')">Preview / print</button></div><div class="row"><div class="row-main"><strong>Teacher activity summary</strong><span>Assessment completion, marking status and support notes.</span></div><button class="btn sm" onclick="exportTeachers()">Export CSV</button></div><div class="row"><div class="row-main"><strong>Student progress register</strong><span>Latest and previous results, attendance context and open interventions.</span></div><button class="btn sm" onclick="exportStudents()">Export CSV</button></div><div class="row"><div class="row-main"><strong>Intervention & retest register</strong><span>Assigned action, status, baseline and retest evidence.</span></div><button class="btn sm" onclick="exportInterventions()">Export CSV</button></div>`)}${panel('Student & parent meeting','Create an individual summary',`<div class="field"><label>Select student</label><select id="brief-student">${db.students.map(s=>`<option value="${s.id}" ${s.id===selectedStudent?'selected':''}>${esc(s.name)} · ${esc(s.class)}</option>`).join('')}</select></div><button class="btn primary" onclick="parentBrief($('brief-student').value)">Prepare editable parent brief</button><p class="muted small">The brief is a draft. Review it before printing or sharing. No email or WhatsApp is sent.</p>`)}${panel('Data and time-savings review','For a real school pilot',`<div class="checkline"><span>□</span><span>Record baseline time spent compiling marks and reports.</span></div><div class="checkline"><span>□</span><span>Measure teacher data-entry time and corrections required.</span></div><div class="checkline"><span>□</span><span>Track follow-up completion and retest participation.</span></div><div class="checkline"><span>□</span><span>Compare like-for-like assessment outcomes before making claims.</span></div><div class="callout">Do not claim time saved or academic improvement until measured with real pilot data.</div>`)}</div>`}
function myWorkPage(){const t=currentTeacher();const own=db.assessments.filter(a=>a.teacher===session.id);const ownStudents=db.students.filter(s=>s.subjects.some(sub=>t?.subjects.includes(sub)));const open=db.interventions.filter(i=>i.teacher===session.id&&i.status!=='completed');return `${pageHead('TEACHER WORKSPACE',`Welcome, ${esc(session.name.split(' ')[0])}`,'Your assigned classes, assessment tasks and student follow-ups—without school-wide staff comparisons.',`<button class="btn" onclick="go('students')">My students</button><button class="btn primary" onclick="newAssessment()">＋ New assessment</button>`)}<div class="grid stats">${stat('Assigned students',t?.students||ownStudents.length,'Across your classes','♙')}${stat('Assessments',own.length,'Saved in demo','▤')}${stat('Open follow-ups',open.length,'Assigned interventions','↗','amber')}${stat('Marking recorded',t?.marking+'%'||'—','Illustrative workflow indicator','✓','teal')}</div><div class="grid cols2"><div>${panel('My assessment work','Assessment records assigned to your account',own.map(a=>`<div class="row"><div class="row-main"><strong>${esc(a.name)}</strong><span>${esc(a.class)} · ${fmtDate(a.date)} · ${a.marks.length} marks rows</span></div><span class="tag ${a.status==='published'?'green':'amber'}">${a.status}</span><button class="btn sm" onclick="openAssessment('${a.id}')">Open</button></div>`).join('')||'<div class="empty">No assessments. Create your first assessment.</div>')}${panel('My follow-up tasks','Students who may need a review',db.tasks.filter(t=>t.owner===session.id&&!t.done).map(t=>`<div class="task"><div class="task-icon">!</div><div style="flex:1"><strong>${esc(t.title)}</strong><p>${esc(t.desc)}</p></div><button class="btn sm" onclick="openTask('${t.id}')">Open</button></div>`).join('')||'<div class="empty">No open tasks.</div>')}</div><div>${panel('My classes','Your teaching allocation',`<div class="pill-list">${(t?.classes||[]).map(c=>`<span class="tag teal">Class ${esc(c)}</span>`).join('')} ${(t?.subjects||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><div class="kpi-note">♙ <span>${ownStudents.length} student records are visible for your assigned subjects in this demo.</span></div>`)}${panel('Learning gaps in my classes','Recorded students requiring review',ownStudents.filter(s=>fallingStudents().some(f=>f.id===s.id)||db.interventions.some(i=>i.student===s.id&&i.teacher===session.id&&i.status!=='completed')).map(s=>`<div class="row"><div class="person">${initials(s.name)}</div><div class="row-main"><strong>${esc(s.name)}</strong><span>${esc(s.class)} · attendance ${s.attendance}%</span></div><button class="btn sm" onclick="openStudent('${s.id}')">Review</button></div>`).join('')||'<div class="empty">No current flags in the sample.</div>')}${panel('Need help or resources?','Record a request for principal review',`<p class="muted small">Use this to document a resource or timetable need; it does not send a notification in this demo.</p><button class="btn" onclick="requestSupport()">＋ Request support</button>`)}</div></div>`}
function openStudent(id){selectedStudent=id;page='student-detail';render()}function openTeacher(id){selectedTeacher=id;teacherTab='overview';page='teacher-profile';render()}function openAssessment(id){selectedAssessment=id;page='assessment-detail';render()}function openIntervention(id){const i=db.interventions.find(x=>x.id===id);if(!i)return;modal(`Intervention · ${subjectFor(i.student)}`,`<div class="form-grid"><div class="field"><label>Student</label><input value="${esc(subjectFor(i.student))}" disabled></div><div class="field"><label>Assigned teacher</label><input value="${esc(nameFor(i.teacher))}" disabled></div><div class="field"><label>Learning gap</label><input id="iv-topic" value="${esc(i.topic)}"></div><div class="field"><label>Due date</label><input id="iv-due" type="date" value="${esc(i.due)}"></div><div class="field full"><label>Intervention action</label><textarea id="iv-action" rows="2">${esc(i.action)}</textarea></div><div class="field"><label>Baseline score (%)</label><input id="iv-base" type="number" min="0" max="100" value="${i.baseline}"></div><div class="field"><label>Retest score (%) — leave blank if not done</label><input id="iv-retest" type="number" min="0" max="100" value="${i.retest??''}"></div><div class="field full"><label>Progress notes</label><textarea id="iv-notes" rows="2">${esc(i.notes||'')}</textarea></div><div class="field full"><label>Status</label><select id="iv-status"><option value="assigned" ${i.status==='assigned'?'selected':''}>Assigned</option><option value="in_progress" ${i.status==='in_progress'?'selected':''}>In progress</option><option value="completed" ${i.status==='completed'?'selected':''}>Completed</option></select></div></div><div class="callout">A retest score is evidence of a change, not proof that the intervention alone caused it. Compare assessment difficulty and relevant context.</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveIntervention('${i.id}')">Save intervention</button></div>`)}function saveIntervention(id){const i=db.interventions.find(x=>x.id===id);i.topic=$('iv-topic').value.trim();i.due=$('iv-due').value;i.action=$('iv-action').value.trim();i.baseline=Number($('iv-base').value)||0;i.retest=$('iv-retest').value===''?null:Number($('iv-retest').value);i.notes=$('iv-notes').value.trim();i.status=$('iv-status').value;save();log('Updated intervention for '+subjectFor(i.student));closeModal();render();toast('Intervention saved locally.')}
function newIntervention(studentId=null,teacherId=null){const availableTeachers=isPrincipal()?db.teachers:db.teachers.filter(t=>t.id===session.id);modal('Assign learning support',`<div class="form-grid"><div class="field"><label>Student</label><select id="new-iv-student">${db.students.filter(s=>!teacherId||s.subjects.some(sub=>teacher(teacherId)?.subjects.includes(sub))).map(s=>`<option value="${s.id}" ${s.id===studentId?'selected':''}>${esc(s.name)} · ${esc(s.class)}</option>`).join('')}</select></div><div class="field"><label>Responsible teacher</label><select id="new-iv-teacher">${availableTeachers.map(t=>`<option value="${t.id}" ${t.id===(teacherId||session.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field full"><label>Learning gap / concept</label><input id="new-iv-topic" placeholder="e.g. Equivalent fractions" required></div><div class="field full"><label>Planned action</label><textarea id="new-iv-action" rows="2" placeholder="Practice sheet, guided group, worked examples…"></textarea></div><div class="field"><label>Baseline score (%)</label><input id="new-iv-base" type="number" min="0" max="100" value="45"></div><div class="field"><label>Due date</label><input id="new-iv-due" type="date" value="2026-10-20"></div><div class="field full"><label>Context and notes</label><textarea id="new-iv-notes" rows="2" placeholder="Record attendance or syllabus context where verified."></textarea></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createIntervention()">Create intervention</button></div>`)}function createIntervention(){const sid=$('new-iv-student').value,tid=$('new-iv-teacher').value,topic=$('new-iv-topic').value.trim();if(!topic){toast('Enter a learning gap first.');return}const i={id:'I'+(++db.nextId),student:sid,subject:student(sid)?.subjects[0]||'General',topic,teacher:tid,assigned:new Date().toISOString().slice(0,10),due:$('new-iv-due').value,status:'assigned',action:$('new-iv-action').value.trim(),baseline:Number($('new-iv-base').value)||0,retest:null,notes:$('new-iv-notes').value.trim()};db.interventions.unshift(i);db.tasks.unshift({id:'T'+(++db.nextId),title:'Review intervention progress',desc:student(sid)?.name+' · '+topic+' · due '+i.due,priority:'medium',type:'intervention',ref:i.id,owner:tid,done:false});save();log('Assigned intervention for '+subjectFor(sid));closeModal();page='interventions';render();toast('Intervention created and follow-up added.')}
function newAssessment(teacherId=null){const who=isPrincipal()?db.teachers:db.teachers.filter(t=>t.id===session.id);modal('Create assessment',`<div class="form-grid"><div class="field full"><label>Assessment name</label><input id="new-a-name" placeholder="e.g. Unit Test 4 — Fractions" required></div><div class="field"><label>Class</label><select id="new-a-class"><option>8A</option><option>8B</option><option>7A</option><option>6A</option></select></div><div class="field"><label>Subject</label><select id="new-a-subject"><option>Mathematics</option><option>Science</option><option>English</option></select></div><div class="field"><label>Responsible teacher</label><select id="new-a-teacher">${who.map(t=>`<option value="${t.id}" ${t.id===(teacherId||session.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Assessment date</label><input id="new-a-date" type="date" value="2026-10-14"></div><div class="field"><label>Maximum marks</label><input id="new-a-max" type="number" min="1" max="200" value="40"></div><div class="field"><label>Number of questions</label><input id="new-a-qs" type="number" min="1" max="40" value="8"></div><div class="field full"><label>Chapters / topics covered</label><input id="new-a-topics" placeholder="e.g. Fractions, decimals, word problems"></div><div class="field full"><label>Assessment path</label><select id="new-a-path"><option>Teacher-created unit test</option><option>Imported state / school paper (mapping review required)</option><option>Retest after intervention</option></select></div></div><div class="callout">This creates an assessment record in the demo. Uploading and AI-mapping real exam papers is not connected in this static version.</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createAssessment()">Create assessment</button></div>`)}function createAssessment(){const name=$('new-a-name').value.trim();if(!name){toast('Enter an assessment name.');return}const a={id:'A'+(++db.nextId),name,class:$('new-a-class').value,subject:$('new-a-subject').value,teacher:$('new-a-teacher').value,date:$('new-a-date').value,max:Number($('new-a-max').value)||40,status:'draft',topics:$('new-a-topics').value,source:$('new-a-path').value,questionCount:Number($('new-a-qs').value)||8,marks:[]};db.assessments.unshift(a);db.tasks.unshift({id:'T'+(++db.nextId),title:'Enter marks and publish results',desc:a.name+' · '+a.class+' · '+a.subject,priority:'medium',type:'assessment',ref:a.id,owner:a.teacher,done:false});save();log('Created assessment '+a.name);closeModal();selectedAssessment=a.id;page='assessment-detail';render();toast('Assessment created. Add marks to continue.')}
function addStudentMarkRow(aid){const a=assessment(aid);const existing=new Set(a.marks.map(m=>m.student));const candidates=db.students.filter(s=>s.class===a.class&&!existing.has(s.id));if(!candidates.length){toast('No unassigned demo students in this class.');return}const s=candidates[0];a.marks.push({student:s.id,score:0,q:Array.from({length:8},()=>0),attendance:s.attendance});save();render();toast('Added '+s.name+' to the marks register.')}
function editQuestionMark(aid,idx,qidx,value){const a=assessment(aid),m=a.marks[idx];if(!m.q)m.q=[];m.q[qidx]=value===''?0:Number(value);m.score=m.q.reduce((x,y)=>x+(Number(y)||0),0);if(m.score>a.max)m.score=a.max;save();const totalCell=document.querySelectorAll('tbody tr')[idx]?.children[9];if(totalCell)totalCell.innerHTML=`<strong>${m.score}</strong>/${a.max}`}
function saveQuestionMarks(aid){const a=assessment(aid);a.marks.forEach(m=>{m.score=Math.min(a.max,(m.q||[]).reduce((x,y)=>x+(Number(y)||0),0))});save();log('Saved question-wise marks for '+a.name);render();toast('Question-wise marks saved locally.')}
function publishAssessment(aid){const a=assessment(aid);if(!a.marks.length){toast('Add student marks before publishing.');return}if(!confirm('Publish this assessment in the demo? Published results will be used by the learning-gap views.'))return;a.status='published';db.tasks=db.tasks.map(t=>t.ref===aid?{...t,done:true}:t);save();log('Published results for '+a.name);render();toast('Assessment published.')}
function parentBrief(sid){const s=student(sid);if(!s)return;const scores=studentScore(sid);const interventions=db.interventions.filter(i=>i.student===sid);const text=`PARENT MEETING BRIEF — SCHOOL DEMO\nStudent: ${s.name} (${s.class})\nPrepared: ${fmtDate(new Date().toISOString().slice(0,10))}\n\nRECORDED ASSESSMENT EVIDENCE\n${scores.map(x=>`• ${x.a.name}: ${x.m.score}/${x.a.max} (${x.pct}%), ${fmtDate(x.a.date)}`).join('\n')||'• No recorded scores'}\n\nLEARNING FOCUS\n${s.notes}\n\nATTENDANCE CONTEXT\nRecorded attendance: ${s.attendance}%. Verify the underlying dates and discuss missed lessons without assuming causation.\n\nSUPPORT AND FOLLOW-UP\n${interventions.map(i=>`• ${i.topic}: ${i.action} | Status: ${i.status} | Baseline: ${i.baseline}% | Retest: ${i.retest===null?'not recorded':i.retest+'%'}`).join('\n')||'• No intervention recorded'}\n\nTEACHER REVIEW REQUIRED\nThis is a draft based on fictional demo records. Teacher must verify accuracy, add context, and approve before sharing. No message has been sent.`;modal('Parent meeting brief · Review before sharing',`<div class="notice" style="margin-top:0">Draft only. Check all information before sharing with a parent or guardian.</div><div class="field"><label>Editable brief</label><textarea id="parent-brief-text" rows="18">${esc(text)}</textarea></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="copyBrief()">Copy text</button><button class="btn" onclick="printBrief()">Print / save PDF</button><button class="btn primary" onclick="saveBrief('${sid}')">Save draft</button></div>`)}function copyBrief(){const el=$('parent-brief-text');el.select();try{document.execCommand('copy');toast('Selected text copied if browser permits.')}catch(e){toast('Select the text and copy manually.')}}function printBrief(){const text=$('parent-brief-text').value;const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print this draft.');return}w.document.write('<html><head><title>Parent meeting brief</title><style>body{font:14px/1.6 Arial;padding:35px;white-space:pre-wrap}</style></head><body>'+esc(text)+'</body></html>');w.document.close();w.print()}function saveBrief(sid){db.messages.unshift({id:'M'+(++db.nextId),student:sid,text:$('parent-brief-text').value,date:new Date().toISOString().slice(0,10),status:'draft'});save();log('Saved parent brief draft for '+subjectFor(sid));closeModal();toast('Parent brief saved as a draft. Nothing was sent.')}function topicAction(topic,action,ids){const t=decodeURIComponent(topic),a=decodeURIComponent(action);modal('Review learning gap',`<h3 style="margin-top:0">${esc(t)}</h3><p class="muted">${esc(a)}</p><strong>Students to review</strong><div class="pill-list" style="margin:9px 0 15px">${ids.split(',').map(id=>`<button class="btn sm" onclick="closeModal();openStudent('${id}')">${esc(subjectFor(id))} →</button>`).join('')}</div><div class="callout">Confirm question-to-topic mapping, attendance context and assessment comparability before assigning support.</div><div style="margin-top:14px"><button class="btn primary" onclick="newIntervention('${ids.split(',')[0]}')">Assign intervention</button></div>`)}
function openTask(id){const t=db.tasks.find(x=>x.id===id);if(!t)return;if(t.type==='student'){openStudent(t.ref);return}if(t.type==='assessment'){openAssessment(t.ref);return}if(t.type==='intervention'){openIntervention(t.ref);return}modal('Action item',`<h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p><button class="btn primary" onclick="completeTask('${id}');closeModal()">Mark reviewed and complete</button>`)}function completeTask(id){const t=db.tasks.find(x=>x.id===id);if(t){t.done=true;save();log('Completed action: '+t.title);render();toast('Action marked complete.')}}function reopenTask(id){const t=db.tasks.find(x=>x.id===id);if(t){t.done=false;save();render()}}
function saveTeacherSupport(id){const t=teacher(id);t.support=$('teacher-support').value.trim();t.training=$('teacher-training').value.trim();save();log('Updated support notes for '+t.name);toast('Support notes saved.');render()}
function requestSupport(){modal('Request support',`<div class="field"><label>Support type</label><select id="support-type"><option>Remedial teaching time</option><option>Practice material</option><option>Training / digital workflow</option><option>Attendance follow-up</option><option>Other</option></select></div><div class="field"><label>What would help?</label><textarea id="support-desc" rows="4" placeholder="Describe the need and affected class/topic."></textarea></div><button class="btn primary" onclick="submitSupport()">Save request</button>`)}function submitSupport(){const desc=$('support-desc').value.trim();db.activity.unshift({date:new Date().toISOString().slice(0,10),who:session.name,action:'Requested support: '+$('support-type').value+' — '+desc});save();closeModal();toast('Support request recorded in the local activity log.');}
function exportCSV(filename,rows){const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);toast('CSV export prepared.')}
function exportStudents(){exportCSV('schoolos-student-progress-demo.csv',[['Student ID','Name','Class','Attendance %','Latest assessment','Latest %','Previous %','Delta points','Open interventions'],...db.students.map(s=>{const ss=studentScore(s.id),open=db.interventions.filter(i=>i.student===s.id&&i.status!=='completed').length;return [s.id,s.name,s.class,s.attendance,ss[0]?.a.name||'',ss[0]?.pct??'',ss[1]?.pct??'',ss.length>1?ss[0].pct-ss[1].pct:'',open]})])}function exportTeachers(){exportCSV('schoolos-teacher-activity-demo.csv',[['Teacher','Subjects','Classes','Students','Assessments done','Assessments total','Marking recorded %','Follow-ups','Attendance coverage %','Syllabus coverage %','Support needs'],...db.teachers.map(t=>[t.name,t.subjects.join('; '),t.classes.join('; '),t.students,t.assessmentsDone,t.assessmentsTotal,t.marking,t.followups,t.attendanceCoverage,t.syllabus,t.support])])}function exportTeacher(id){const t=teacher(id);exportCSV('schoolos-'+id+'-teacher-profile.csv',[['Teacher','Subjects','Classes','Students','Assessments complete','Assessments total','Marking %','Follow-ups','Attendance context %','Syllabus coverage %','Support'],[t.name,t.subjects.join(';'),t.classes.join(';'),t.students,t.assessmentsDone,t.assessmentsTotal,t.marking,t.followups,t.attendanceCoverage,t.syllabus,t.support]])}function exportInterventions(){exportCSV('schoolos-interventions-demo.csv',[['ID','Student','Subject','Topic','Teacher','Assigned','Due','Status','Action','Baseline %','Retest %','Notes'],...db.interventions.map(i=>[i.id,subjectFor(i.student),i.subject,i.topic,nameFor(i.teacher),i.assigned,i.due,i.status,i.action,i.baseline,i.retest??'',i.notes])])}function exportMarks(id){const a=assessment(id);exportCSV('schoolos-'+id+'-marks.csv',[['Assessment',a.name],['Student ID','Student','Class',...Array.from({length:8},(_,i)=>'Q'+(i+1)),'Total','Maximum','Percent','Attendance'],...a.marks.map(m=>[m.student,subjectFor(m.student),student(m.student)?.class,...Array.from({length:8},(_,i)=>m.q?.[i]??''),m.score,a.max,Math.round(m.score/a.max*100),m.attendance??student(m.student)?.attendance??''])])}
function printReport(type){if(type==='overview'){const rows=db.assessments.map(a=>`${a.name} — ${a.class} ${a.subject} — ${a.marks.length} students — ${a.status}`);modal('Academic overview report',`<div class="field"><label>Printable report content</label><textarea id="report-text" rows="15">SCHOOLOS AI — ACADEMIC OVERVIEW\n${db.school}\nReport date: ${fmtDate(new Date().toISOString().slice(0,10))}\n\nASSESSMENTS\n${rows.join('\n')}\n\nOPEN ACTIONS: ${db.tasks.filter(t=>!t.done).length}\nOPEN INTERVENTIONS: ${db.interventions.filter(i=>i.status!=='completed').length}\n\nFictional demo data. Verify records before real use.</textarea></div><button class="btn primary" onclick="printText('report-text')">Print / save PDF</button>`)} }function printText(id){const text=$(id).value;const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print.');return}w.document.write('<html><head><title>SchoolOS report</title><style>body{font:14px/1.6 Arial;padding:35px;white-space:pre-wrap}</style></head><body>'+esc(text)+'</body></html>');w.document.close();w.print()}
function showAbout(){modal('Demo & data guide',`<h3 style="margin-top:0">What this demo does</h3><ul><li>Role-specific sign-in for a principal and three teachers.</li><li>Principal overview, teacher profiles, student records, assessment marks, learning gaps, interventions, retests and report exports.</li><li>Parent meeting brief draft with editable text; nothing is sent.</li><li>Local browser persistence so you can test changes and reload.</li></ul><h3>What is not connected</h3><ul><li>No real authentication or secure user permissions.</li><li>No shared cloud database, backups or cross-device sync.</li><li>No actual AI paper extraction, question mapping or WhatsApp/email delivery.</li><li>All sample school data is fictional; browser storage is not suitable for real student data.</li></ul><p class="muted small">This is a functional workflow prototype, not a production-ready deployment.</p><button class="btn primary" onclick="closeModal()">Understood</button>`)}function showMore(){modal('More sections',`<div class="grid" style="grid-template-columns:1fr 1fr">${navItems().filter(x=>!['overview','tasks','students','teachers','assessments'].includes(x[0])).map(([id,ico,label])=>`<button class="btn" onclick="closeModal();go('${id}')">${ico} ${label}</button>`).join('')}<button class="btn" onclick="closeModal();showAbout()">ⓘ Demo & data guide</button><button class="btn" onclick="closeModal();resetDemo()">↺ Reset sample data</button></div>`)}function modal(title,content){$('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="xbtn" onclick="closeModal()">×</button></div>${content}</div></div>`}function closeModal(){$('modal-root').innerHTML=''}

load();render();
