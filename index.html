eight:900;color:var(--navy)}.legend{display:grid;gap:8px;font-size:11px}.legend span i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}.insight{background:#effaf7;border:1px solid #ccefe5;color:#28665e;border-radius:10px;padding:11px;font-size:11px;margin-top:12px}.notice{background:#effaf7;border:1px solid #ccefe5;color:#28665e;border-radius:10px;padding:12px;font-size:11px;margin:12px 0}.notice.warn{background:#fff8e7;border-color:#f5e1aa;color:#805a12}.listrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.avatar{width:35px;height:35px;border-radius:11px;background:#e7f7f4;color:#087f73;display:grid;place-items:center;font-weight:900;flex:0 0 35px}.grow{flex:1;min-width:0}.grow b{display:block;font-size:12px;color:var(--navy)}.grow p{margin:3px 0 0;font-size:10px;color:var(--muted)}.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:white;margin-bottom:10px}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:800;color:#526176;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d5deea;border-radius:10px;background:white;color:var(--ink)}.field textarea{min-height:135px;resize:vertical}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);padding:12px;border-radius:11px;background:white;text-align:left;color:var(--ink)}.choice.active{border-color:var(--teal);background:var(--mint)}.choice b{display:block;font-size:11px}.choice small{font-size:10px;color:var(--muted)}.bottomnav{position:fixed;z-index:6;bottom:0;left:0;right:0;padding:7px 4px calc(env(safe-area-inset-bottom) + 7px);background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;gap:2px}.bottomnav button{background:transparent;color:#77859a;padding:6px 3px;min-width:0;flex:1;font-size:9px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:8px}.bottomnav button .navicon{font-size:17px;line-height:1.1}.bottomnav button.active{color:var(--teal);background:var(--mint)}.hide{display:none!important}.detailtop{display:flex;align-items:center;gap:8px;margin-bottom:15px}.backbtn{background:white;border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--navy);font-weight:800}.studentbig{display:flex;align-items:center;gap:12px}.studentbig .avatar{width:48px;height:48px;font-size:16px}.scorebig{font-size:30px;font-weight:900;color:var(--navy);letter-spacing:-1px}.footer{text-align:center;color:#8b98a9;font-size:10px;padding:24px 5px}.toast{position:fixed;z-index:10;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:10px 15px;border-radius:10px;font-size:11px;box-shadow:var(--shadow);max-width:90%;text-align:center}.sectiontabs{display:flex;gap:7px;overflow:auto;padding-bottom:5px;margin-bottom:12px}.sectiontabs button{white-space:nowrap;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:white;font-size:10px;font-weight:800;color:#53647b}.sectiontabs button.active{background:var(--navy);color:white}.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.teachergrid{display:grid;gap:10px}.teacherbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:white}.teacherbox .rowtop{display:flex;align-items:center;gap:9px}.teacherbox .rowtop .avatar{width:34px;height:34px}.teacherbox .progress{margin-top:10px}.progressline{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:5px}

<body><div class="app"><aside class="sidebar"><div class="sidebrand"><div class="logo">S</div><div><b>SchoolOS AI</b><small>ASSESSMENT TO IMPROVEMENT</small></div></div><div class="sidegroup" id="sideRoleLabel">SCHOOL LEADERSHIP</div><nav class="side-nav" id="sideNav"></nav><div class="sidefoot">INTERACTIVE CONCEPT DEMO<br>Demo High School<br><br>Fictional data · Saved on this device</div></aside><main class="main"><header class="top"><div class="brand"><div class="logo">S</div><div><b>SchoolOS AI</b><small>ASSESSMENT TO IMPROVEMENT</small></div></div><div class="top-actions"><div class="role-toggle"><button id="rolePrincipal" onclick="setRole('principal')">Principal</button><button id="roleTeacher" onclick="setRole('teacher')">Teacher</button></div><button class="iconbtn" id="backTop" onclick="goBack()" style="display:none">← Back</button></div></header><div class="content" id="content"></div></main><nav class="bottomnav" id="bottomNav"></nav></div><div id="toast" class="toast hide"></div>
<script>
const TOPICS=['Fractions','Decimals','Algebra','Geometry','Data Handling'];
const PEOPLE=['Aarav Reddy','Ananya Sharma','Arjun Kumar','Bhavya Rao','Charan Naidu','Diya Patel','Eesha Varma','Farhan Ali','Gowri Devi','Harish Teja','Ishita Singh','Jahnavi Rao','Karthik Reddy','Lavanya Das','Manoj Kumar','Navya Sri','Om Prakash','Pranav Goud','Rithika Nair','Sahil Khan','Tanvi Rao','Uday Kiran','Vaishnavi Reddy','Wasim Ahmed'];
const TEACHERS=[{id:1,name:'Sravani Reddy',subject:'Mathematics',classes:'8A, 8B',activity:'Confirmed Unit Test 2 results',completion:92},{id:2,name:'Ramesh Kumar',subject:'Science',classes:'7A, 8A',activity:'Prepared Chapter 4 assessment',completion:78},{id:3,name:'Anusha Rao',subject:'English',classes:'8A, 9A',activity:'Created remedial practice',completion:85},{id:4,name:'Vikram Naidu',subject:'Social Studies',classes:'7B, 8B',activity:'Reviewed student progress',completion:68}];
function seed(){const students=PEOPLE.map((name,i)=>({id:i+1,roll:i+1,name,admission:'DEMO'+String(i+1).padStart(3,'0'),className:'8A',parent:'Demo contact'}));const assessments=[{id:1,title:'Unit Test 1 — Number Sense',kind:'Unit Test',date:'2026-10-02',status:'Results confirmed',max:25,teacher:1,topics:['Fractions','Decimals','Fractions','Decimals','Algebra']},{id:2,title:'Unit Test 2 — Expressions',kind:'Unit Test',date:'2026-10-06',status:'Results confirmed',max:25,teacher:1,topics:['Algebra','Fractions','Geometry','Algebra','Data Handling']},{id:3,title:'SA Practice — Mixed Topics',kind:'Practice',date:'2026-10-10',status:'Results confirmed',max:25,teacher:2,topics:TOPICS}];for(const a of assessments){a.questions=a.topics.map((topic,i)=>({id:i+1,no:i+1,topic,prompt:question(topic,i+1),max:5}));a.marks={};students.forEach(st=>{a.marks[st.id]=a.questions.map((q,i)=>{let n=4.2-((st.roll%7===0&&q.topic==='Fractions')?1.9:0)-((st.roll%6===0&&q.topic==='Algebra')?1.2:0)+((((st.roll*3+i*7+a.id*2)%7)-3)*.42);if(a.id===3&&q.topic==='Fractions'&&st.roll%7===0)n-=.9;return Math.max(0,Math.min(5,Math.round(n*10)/10))})})}return {students,assessments,interventions:[],activity:[{teacher:1,event:'Results confirmed',detail:'Unit Test 2 — Expressions',date:'Oct 06'},{teacher:2,event:'Assessment prepared',detail:'SA Practice — Mixed Topics',date:'Oct 10'},{teacher:3,event:'Practice assigned',detail:'Fractions revision group',date:'Oct 11'}],messages:[]}}
let db;try{db=JSON.parse(localStorage.getItem('schoolos_mobile_demo')||'null')}catch(e){db=null}if(!db||!db.students||!db.assessments)db=seed();let role='principal',page='dashboard',previousPage='dashboard',selectedAssessment=null,selectedStudent=null,selectedTopic='Fractions',chartMode='bars',createSource='generate',toastTimer;
function save(){try{localStorage.setItem('schoolos_mobile_demo',JSON.stringify(db))}catch(e){toast('Browser storage is unavailable; changes may last only for this session.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pct(n){return Math.max(0,Math.min(100,Number(n)||0))}function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}function topicScores(a,studentId=null){let out={};TOPICS.forEach(t=>{const vals=[];a.questions.forEach((q,qi)=>{if(q.topic===t){const scores=studentId?[a.marks[studentId]?.[qi]]:db.students.map(s=>a.marks[s.id]?.[qi]);scores.filter(v=>v!==undefined&&v!==null&&v!=='').forEach(v=>vals.push(100*Number(v)/q.max))}});if(vals.length)out[t]=avg(vals)});return out}function classAverage(a){const vals=[];db.students.forEach(s=>(a.marks[s.id]||[]).forEach((v,i)=>{if(v!==null&&v!==undefined&&v!==''&&a.questions[i])vals.push(100*Number(v)/a.questions[i].max)}));return avg(vals)}function studentScore(a,s){return (a.marks[s.id]||[]).reduce((sum,v,i)=>sum+Number(v||0),0)}function latestAssessment(){return [...db.assessments].reverse().find(a=>a.status==='Results confirmed')||db.assessments[db.assessments.length-1]}function gaps(){const a=latestAssessment();if(!a)return [];return db.students.flatMap(s=>Object.entries(topicScores(a,s.id)).filter(([t,v])=>v<55).map(([topic,value])=>({student:s,topic,value,assessment:a.title})))}function latestForTeacher(){return [...db.assessments].reverse().find(a=>a.teacher===1)||latestAssessment()}function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hide'),2500)}
const NAV=[{id:'dashboard',label:'Overview',icon:'▦'},{id:'assessments',label:'Assessments',icon:'▤'},{id:'students',label:'Students',icon:'♙'},{id:'gaps',label:'Learning gaps',icon:'⌁'},{id:'messages',label:'Parent messages',icon:'▱'}];
function setRole(r){role=r;page='dashboard';render()}function navigate(p,data=null){previousPage=page;page=p;if(data?.assessment)selectedAssessment=data.assessment;if(data?.student)selectedStudent=data.student;if(data?.topic)selectedTopic=data.topic;render();window.scrollTo({top:0,behavior:'smooth'})}function goBack(){if(['assessment','paper','marks','results','student','practice','teacher-detail','create'].includes(page)){page=previousPage==='dashboard'?'dashboard':previousPage}else page='dashboard';render()}
function navMarkup(){const arr=role==='principal'?[...NAV.slice(0,1),...NAV.slice(1),{id:'teachers',label:'Teachers',icon:'♧'}]:NAV;const make=n=>`<button class="${page===n.id?'active':''}" onclick="navigate('${n.id}')"><span class="navicon">${n.icon}</span>${n.label}</button>`;document.getElementById('sideNav').innerHTML=arr.map(make).join('');document.getElementById('bottomNav').innerHTML=arr.map(make).join('');document.getElementById('sideRoleLabel').textContent=role==='principal'?'SCHOOL LEADERSHIP':'MY TEACHING WORKSPACE';document.getElementById('rolePrincipal').classList.toggle('active',role==='principal');document.getElementById('roleTeacher').classList.toggle('active',role==='teacher');document.getElementById('backTop').style.display=page==='dashboard'?'none':'inline-block'}
function pageHead(eyebrow,title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${action?`<div>${action}</div>`:''}</div>`}function metric(label,value,sub,icon){return `<div class="metric"><div class="miniicon">${icon}</div><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}function pill(text,kind=''){return `<span class="pill ${kind}">${text}</span>`}function chart(items,id='topicChart'){const colors=['#0d9488','#3975b9','#f0ad4e','#8b7bd8','#df6d75','#4f9c6c'];const total=items.reduce((a,x)=>a+x.value,0)||1;let pos=0;const stops=items.map((x,i)=>{let start=pos;pos+=x.value/total*100;return `${colors[i%colors.length]} ${start}% ${pos}%`}).join(',');const bars=items.map(x=>`<div class="barcol"><div class="value">${Math.round(x.value)}%</div><div class="bar ${x.value<50?'low':''}" style="height:${Math.max(2,x.value*0.72)}%"></div><div class="label">${esc(x.label)}</div></div>`).join('');const table=items.slice().sort((a,b)=>a.value-b.value).map(x=>`<tr><td>${esc(x.label)}</td><td><b>${x.value.toFixed(1)}%</b></td><td><div class="bartrack"><div class="barfill ${x.value<50?'low':''}" style="width:${pct(x.value)}%"></div></div></td></tr>`).join('');const legend=items.map((x,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${esc(x.label)} · ${Math.round(x.value)}%</span>`).join('');return `<div class="chart-card"><div class="sectionhead"><div><h2>Learning outcomes by topic</h2><div class="muted small">Choose your preferred view</div></div></div><div class="chart-toolbar"><button class="${chartMode==='bars'?'active':''}" onclick="setChartMode('bars')">Bars</button><button class="${chartMode==='share'?'active':''}" onclick="setChartMode('share')">Share</button><button class="${chartMode==='table'?'active':''}" onclick="setChartMode('table')">Table</button></div><div class="${chartMode==='bars'?'':'hide'}">${items.length?`<div class="bars">${bars}</div>`:'<div class="empty">No topic results yet.</div>'}</div><div class="${chartMode==='share'?'':'hide'}"><div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops})"></div><div class="legend">${legend}</div></div></div><div class="${chartMode==='table'?'':'hide'}"><div class="tablewrap"><table class="chart-table"><thead><tr><th>Topic</th><th>Score</th><th>Level</th></tr></thead><tbody>${table}</tbody></table></div></div><div class="insight">Low topic scores are signals for teacher review, not labels or diagnoses. Compare multiple assessments before concluding that a student has a persistent gap.</div></div>`}function setChartMode(m){chartMode=m;render()}
function dashboard(){const a=role==='teacher'?latestForTeacher():latestAssessment();const topic=topicScores(a);const issue=gaps();const average=a?classAverage(a):0;let html=pageHead(role==='principal'?'PRINCIPAL / SCHOOL OWNER':'TEACHER WORKSPACE',role==='principal'?'School performance overview':'Your teaching workspace',role==='principal'?'See school-wide progress, assessment activity, teacher follow-up and topics needing attention.':'Prepare assessments, record marks when you return after the exam, and decide what to reteach next.',`<button class="btn" onclick="navigate('create')">＋ Prepare paper</button>`);html+=`<div class="hero"><div class="eyebrow">${role==='principal'?'SCHOOL LEADERSHIP VIEW':'YOUR CLASSROOM WORKFLOW'}</div><h2>${role==='principal'?'Turn school data into better academic decisions':'Teach → assess → understand → improve'}</h2><p>${role==='principal'?'Spot patterns across assessments, understand where support is needed, and follow teacher actions without relying on a single test.':'Prepare a paper now. Conduct and correct the exam offline. Return later to enter question-wise marks and get practical next steps.'}</p><button class="btn" onclick="navigate('${role==='principal'?'teachers':'assessments'}')">${role==='principal'?'Review teacher activity':'Continue assessment work'} →</button></div>`;const assessCount=role==='teacher'?db.assessments.filter(x=>x.teacher===1).length:db.assessments.length;html+=`<div class="metrics">${metric(role==='principal'?'Students covered':'My students',db.students.length,'Fictional demo roster','♙')}${metric(role==='principal'?'Assessments recorded':'My assessments',assessCount,'Prepared and recorded','▤')}${metric('Latest class average',`${average.toFixed(0)}%`,a?.title||'No results yet','↗')}${metric(role==='principal'?'Support signals':'Students to review',issue.length,'Evidence prompts for review','⌁')}</div>`;html+=chart(Object.entries(topic).map(([label,value])=>({label,value})));if(role==='principal'){html+=`<div class="stack" style="margin-top:13px"><section class="card"><div class="sectionhead"><h2>Student progress vs own previous result</h2>${pill('Sample trend')}</div><p class="muted small">Compare each learner with their own history, not just classmates. Differences in paper difficulty can affect scores.</p>${db.students.slice(0,4).map(st=>{const series=db.assessments.filter(x=>x.status==='Results confirmed');const prev=series[series.length-2],last=series[series.length-1];const p=prev?100*studentScore(prev,st)/prev.max:0;const n=last?100*studentScore(last,st)/last.max:0;return `<div class="listrow"><div class="avatar">${st.roll}</div><div class="grow"><b>${esc(st.name)}</b><p>Previous ${p.toFixed(0)}% → latest ${n.toFixed(0)}%</p></div>${pill((n-p>=0?'+':'')+(n-p).toFixed(0)+' pp',n<p?'amber':'green')}</div>`}).join('')}<div class="notice">Use this as a prompt for supportive review. Check attendance, taught content and assessment comparability before acting.</div></section><section class="card"><div class="sectionhead"><h2>Students and classes needing support</h2>${pill('Illustrative')}</div><div class="listrow"><div class="grow"><b>Class 8A · Mathematics</b><p>Fractions is the main topic to review; 6 students show repeated signals in this scenario.</p></div>${pill('Review','amber')}</div><div class="listrow"><div class="grow"><b>Before the next assessment</b><p>Prioritise 3 students for teacher-reviewed support.</p></div>${pill('3 students','amber')}</div><div class="listrow"><div class="grow"><b>After remedial practice</b><p>8 of 12 sample students improved on a comparable retest; 3 stayed level and 1 declined.</p></div>${pill('8 improved','green')}</div><div class="notice warn">Remedial outcomes are fictional scenario data, not a measured result from a real school.</div></section><section class="card"><h2>Parent meeting brief</h2><p><b>Progress:</b> Review each student against their own previous result.</p><p><b>Concept to revisit:</b> Fractions, using question-wise evidence.</p><p><b>Next step:</b> Check attendance and syllabus coverage, agree a short practice plan, and review after a retest.</p><div class="notice">Sample summary only. Review approved student records before sharing with a parent.</div></section></div>`}else{html+=`<section class="card" style="margin-top:13px"><div class="sectionhead"><h2>Context before interpreting results</h2>${pill('Sample data')}</div><div class="metrics">${metric('Attendance','91%','Class average')}${metric('Syllabus covered','78%','Teacher-entered estimate')}</div><p class="muted small">4 students had recent absences in this fictional scenario. Review missed instruction, assessment difficulty, syllabus coverage and student work before deciding what to reteach.</p><div class="notice warn">A low class score is not, by itself, evidence of poor teaching. These figures are fictional and are not connected to school attendance records.</div></section>`}html+='<div class="stack two-col" style="margin-top:14px"><section class="card"><div class="sectionhead"><h2>Next actions</h2>'+pill(role==='principal'?'Leadership':'For you')+'</div>';const acts=role==='principal'?[['Review student support list','See who may need help and why','gaps'],['View teacher activity','Track assessment and follow-up work','teachers'],['Open assessment register','Review all recent assessment cycles','assessments']]:[['Continue an assessment','Enter marks or open a report','assessments'],['Review learning gaps','Choose a topic for targeted practice','gaps'],['Prepare parent updates','Review message drafts before sharing','messages']];html+=acts.map(x=>`<div class="listrow"><div class="avatar">→</div><div class="grow"><b>${x[0]}</b><p>${x[1]}</p></div><button class="btn secondary small" onclick="navigate('${x[2]}')">Open</button></div>`).join('');html+='</section><section class="card"><div class="sectionhead"><h2>Recent activity</h2><span class="muted small">Demo timeline</span></div>';html+=db.activity.slice().reverse().slice(0,4).map(x=>`<div class="listrow"><div class="avatar">✓</div><div class="grow"><b>${role==='principal'?TEACHERS.find(t=>t.id===x.teacher)?.name||'Teacher':'You'} · ${esc(x.event)}</b><p>${esc(x.detail)} · ${esc(x.date)}</p></div></div>`).join('');html+='</section></div>';return html}
function assessmentsPage(){let arr=role==='teacher'?db.assessments.filter(a=>a.teacher===1):db.assessments;let html=pageHead(role==='principal'?'ACADEMIC OPERATIONS':'TEACHER WORKSPACE',role==='principal'?'Assessment register':'My assessments','Create a paper, conduct the exam offline, and return here to enter marks and review results.',`<button class="btn" onclick="navigate('create')">＋ Create assessment</button>`);html+='<div class="notice">You do not need to keep SchoolOS open during the exam. Paper preparation and marks entry can happen at different times.</div><div class="stack">';html+=arr.slice().reverse().map(a=>`<section class="card"><div class="sectionhead"><div><div class="eyebrow">${esc(a.kind)} · ${esc(a.date)}</div><h2>${esc(a.title)}</h2><div class="muted small">Class 8A · Mathematics · ${a.questions.length} questions · ${a.max} marks</div></div>${pill(a.status,a.status==='Results confirmed'?'green':'amber')}</div><div class="sectiontabs"><button onclick="openAssessment(${a.id},'paper')">View / print paper</button><button onclick="openAssessment(${a.id},'marks')">Enter marks</button><button onclick="openAssessment(${a.id},'results')">View report</button></div></section>`).join('');html+='</div>';return html}
function createPage(){let html=pageHead('ASSESSMENT SETUP','Prepare an assessment','Choose an existing paper or create a new one. The demo checks question completeness, topic mapping and mark totals.');html+=`<section class="card"><div class="field"><label>Assessment name</label><input id="newTitle" placeholder="e.g. Class 8 Fractions Unit Test" value="Class 8 Mathematics Unit Test"></div><div class="field"><label>Assessment type</label><select id="newKind"><option>Unit Test</option><option>Formative Assessment</option><option>Summative Assessment</option><option>Practice</option><option>Retest</option></select></div><div class="field"><label>How do you want to start?</label><div class="choicegrid"><button class="choice ${createSource==='generate'?'active':''}" onclick="setCreateSource('generate')"><b>Generate a paper</b><small>Use topic templates</small></button><button class="choice ${createSource==='existing'?'active':''}" onclick="setCreateSource('existing')"><b>Use an existing paper</b><small>Paste question text</small></button></div></div><div id="generateOptions" class="${createSource==='generate'?'':'hide'}"><div class="field"><label>Topics (choose one or more)</label><div class="choicegrid">${TOPICS.map((t,i)=>`<label class="choice"><input type="checkbox" class="topicCheck" value="${t}" ${i<2?'checked':''}> <b>${t}</b><small>Map each question to this topic</small></label>`).join('')}</div></div><div class="field"><label>Number of questions</label><select id="newCount"><option value="5">5 questions</option><option value="10">10 questions</option><option value="15">15 questions</option></select></div></div><div id="existingOptions" class="${createSource==='existing'?'':'hide'}"><div class="field"><label>Paste one question per line; optional marks like [3]</label><textarea id="paperText" placeholder="Q1. Simplify 12/18. [4]\nQ2. Solve x + 7 = 15. [6]"></textarea></div><div class="field"><label>Topics to use for mapping</label><div class="choicegrid">${TOPICS.map((t,i)=>`<label class="choice"><input type="checkbox" class="existingTopic" value="${t}" ${i<2?'checked':''}> <b>${t}</b></label>`).join('')}</div></div></div><div class="field"><label>Maximum marks</label><input id="newMax" type="number" min="1" max="100" step="0.5" value="25"></div><div id="validationBox"></div><button class="btn" style="width:100%" onclick="createAssessment()">Validate and prepare paper →</button><div class="muted small" style="margin-top:10px">Offline demo: uses fixed templates and rule-based topic hints, not live AI. Review before using a paper in a real class.</div></section>`;return html}
function setCreateSource(s){createSource=s;render()}function question(topic,i){const map={Fractions:['Simplify 12/18.','Add 2/5 and 1/5.','Find 3/4 of 20.','Compare 5/8 and 3/4.','A ribbon is 3/5 m. What remains after using 1/5 m?'],Decimals:['Write 4.075 in expanded form.','Add 12.45 and 3.8.','Subtract 7.25 from 10.','Multiply 2.4 by 3.','A notebook costs ₹18.50. Find the cost of four.'],Algebra:['Simplify 3x + 2x.','Find x if x + 7 = 15.','Evaluate 2a + 3 when a = 4.','Write an expression for 5 more than twice n.','Solve 3x = 21.'],Geometry:['Name a quadrilateral with four equal sides.','Find the perimeter of a rectangle 8 cm by 3 cm.','How many degrees are in a right angle?','Find area of a 6 cm by 4 cm rectangle.','Name two properties of a parallelogram.'],'Data Handling':['Find the mean of 2, 4, 6.','Which graph compares categories?','Find the mode of 3, 5, 5, 7.','Find the range of 4, 9, 11, 15.','A class has 12 boys and 18 girls. Find total.']};return (map[topic]||map.Fractions)[(i-1)%5]}
function mapTopic(text,topics){const t=text.toLowerCase();if(/fraction|numerator|denominator|\d+\s*\/\s*\d+/.test(t))return 'Fractions';if(/decimal|percentage|percent/.test(t))return 'Decimals';if(/solve|equation|expression|\bx\s*=|variable/.test(t))return 'Algebra';if(/angle|triangle|rectangle|perimeter|area|shape|parallelogram/.test(t))return 'Geometry';if(/mean|mode|median|graph|data|range/.test(t))return 'Data Handling';return topics[0]||'Fractions'}
function createAssessment(){const title=document.getElementById('newTitle').value.trim();const kind=document.getElementById('newKind').value;const max=Number(document.getElementById('newMax').value);let qs=[];let topics=[];if(!title){validation('Please enter an assessment name.');return}if(!Number.isFinite(max)||max<=0||max>100){validation('Maximum marks must be between 1 and 100.');return}if(createSource==='generate'){topics=[...document.querySelectorAll('.topicCheck:checked')].map(x=>x.value);if(!topics.length){validation('Select at least one topic before generating.');return}const n=Number(document.getElementById('newCount').value);qs=Array.from({length:n},(_,i)=>({no:i+1,topic:topics[i%topics.length],prompt:question(topics[i%topics.length],i+1),max:max/n}))}else{topics=[...document.querySelectorAll('.existingTopic:checked')].map(x=>x.value);const text=document.getElementById('paperText').value.trim();if(!text){validation('Paste the existing question paper text first.');return}if(!topics.length){validation('Select at least one topic for question mapping.');return}const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!lines.length){validation('No questions were found.');return}const parsed=lines.map((line,i)=>{const m=line.match(/\[(\d+(?:\.\d+)?)\]\s*$/)||line.match(/\((\d+(?:\.\d+)?)\s*marks?\)\s*$/i);const prompt=line.replace(/^Q(?:uestion)?\s*\d+[.)]?\s*/i,'').replace(/\s*(?:\[\d+(?:\.\d+)?\]|\(\d+(?:\.\d+)?\s*marks?\))\s*$/i,'').trim();return {no:i+1,prompt,topic:mapTopic(prompt,topics),max:m?Number(m[1]):null}});const missing=parsed.filter(q=>q.max===null).length;const specified=parsed.reduce((sum,q)=>sum+(q.max||0),0);if(parsed.some(q=>q.prompt.length<8)){validation('One question looks incomplete. Add a complete question prompt.');return}if(specified>max+.001||(missing===0&&Math.abs(specified-max)>.001)){validation(`Question marks total ${specified}, but maximum marks are ${max}. Adjust them so totals match exactly.`);return}if(missing){const remain=max-specified;if(remain<=0){validation('There are questions without marks but no marks remain to allocate.');return}parsed.forEach(q=>{if(q.max===null)q.max=remain/missing})}qs=parsed}const sum=qs.reduce((s,q)=>s+q.max,0);if(Math.abs(sum-max)>.02){validation(`Question marks add up to ${sum.toFixed(2)}, not ${max}. Please review the paper.`);return}const a={id:Math.max(0,...db.assessments.map(x=>x.id))+1,title,kind,date:new Date().toISOString().slice(0,10),status:'Draft',max,teacher:1,questions:qs.map((q,i)=>({...q,id:i+1})),marks:{}};db.assessments.push(a);db.activity.unshift({teacher:1,event:'Assessment prepared',detail:title,date:'Just now'});save();selectedAssessment=a.id;previousPage='assessments';page='paper';render();window.scrollTo({top:0,behavior:'smooth'});}
function validation(msg){const b=document.getElementById('validationBox');b.innerHTML=`<div class="notice warn">${esc(msg)}</div>`}
function openAssessment(id,dest){selectedAssessment=id;previousPage='assessments';navigate(dest,{assessment:id})}function getA(){return db.assessments.find(a=>a.id===selectedAssessment)}function paperPage(){const a=getA();if(!a)return '<div class="empty">Assessment not found.</div>';const options=q=>TOPICS.map(t=>`<option value="${t}" ${q.topic===t?'selected':''}>${t}</option>`).join('');return `<div class="detailtop"><button class="backbtn" onclick="goBack()">← Back</button>${pill(a.status,a.status==='Results confirmed'?'green':'amber')}</div>${pageHead('REVIEW BEFORE PRINTING',esc(a.title),`Class 8A · Mathematics · ${a.max} maximum marks`)}<div class="notice">Check every question, topic and mark allocation. If you change question maximums, the total must still match the paper total. This offline demo uses fixed templates or simple topic hints; review the mapping before use.</div><form class="card review-form" onsubmit="event.preventDefault();savePaperReview(${a.id})"><div class="sectionhead"><h2>Question mapping review</h2><span class="muted small">${a.questions.length} questions</span></div>${a.questions.map(q=>`<div class="listrow" style="align-items:flex-start"><div class="avatar">Q${q.no}</div><div class="grow"><div class="field"><label>Question text</label><textarea id="prompt-${q.id}" rows="2" maxlength="500">${esc(q.prompt)}</textarea></div><div class="field"><label>Mapped topic</label><select id="topic-${q.id}">${options(q)}</select></div><div class="field"><label>Maximum marks</label><input id="max-${q.id}" type="number" min="0.5" max="${a.max}" step="0.5" value="${q.max}"></div></div></div>`).join('')}<div class="sectiontabs"><button type="submit">Save question review</button><button type="button" onclick="window.print()">Print / Save PDF</button><button type="button" onclick="openAssessment(${a.id},'marks')">Enter marks later →</button></div></form><section class="card paper-preview" style="margin-top:12px"><div style="text-align:center;border-bottom:1px solid var(--line);padding-bottom:12px"><div class="eyebrow">DEMO HIGH SCHOOL</div><h2 style="font-size:20px">${esc(a.title)}</h2><p class="muted small">Class 8 · Mathematics · ${esc(a.kind)} · Maximum ${a.max} marks</p></div>${a.questions.map(q=>`<div class="listrow" style="align-items:flex-start"><div class="avatar">Q${q.no}</div><div class="grow"><b>${esc(q.prompt)}</b><p>${esc(q.topic)} · ${q.max} marks</p><div style="height:25px"></div></div></div>`).join('')}<div class="notice warn">Concept-demo paper. Review all questions and mappings; this is not an official SCERT/DCEB paper.</div></section>`}
function savePaperReview(id){const a=db.assessments.find(x=>x.id===id);if(!a)return;const updated=[];let total=0;for(const q of a.questions){const prompt=document.getElementById(`prompt-${q.id}`).value.trim();const topic=document.getElementById(`topic-${q.id}`).value;const max=Number(document.getElementById(`max-${q.id}`).value);if(prompt.length<8){toast(`Question ${q.no} needs a complete prompt.`);return}if(!TOPICS.includes(topic)){toast(`Choose a supported topic for Q${q.no}.`);return}if(!Number.isFinite(max)||max<=0||max>a.max){toast(`Q${q.no} maximum marks are invalid.`);return}if(Object.values(a.marks||{}).some(vals=>Array.isArray(vals)&&vals.some(v=>v!==null&&v!==undefined&&v!==''))&&Math.abs(max-q.max)>.001){toast('Question maximums are locked after marks are entered. Topic and text can still be reviewed.');return}total+=max;updated.push({q,prompt,topic,max})}if(Math.abs(total-a.max)>.02){toast(`Question marks total ${total.toFixed(2)}; paper maximum is ${a.max}.`);return}updated.forEach(x=>{x.q.prompt=x.prompt;x.q.topic=x.topic;x.q.max=x.max});db.activity.unshift({teacher:1,event:'Question mapping reviewed',detail:a.title,date:'Just now'});save();render();toast('Question mapping saved.')}
function marksPage(){const a=getA();if(!a)return '<div class="empty">Assessment not found.</div>';const students=db.students;return `<div class="detailtop"><button class="backbtn" onclick="goBack()">← Back</button>${pill('MARK ENTRY')}</div>${pageHead('AFTER THE EXAM','Question-wise marks register',`${a.title} · Enter marks after correcting the answer scripts. You can save progress and return later.`)}<div class="notice">For the demo, enter marks in the question columns. Values above each question's maximum are rejected. Results update when you save.</div><section class="card"><div class="sectionhead"><h2>Marks register</h2><span class="muted small">${students.length} students</span></div><div class="tablewrap"><table><thead><tr><th>Student</th>${a.questions.map(q=>`<th>Q${q.no}<br>/${q.max}</th>`).join('')}<th>Total</th></tr></thead><tbody>${students.map(st=>{const vals=a.marks[st.id]||[];const total=vals.reduce((s,v)=>s+Number(v||0),0);return `<tr><td>${st.roll}. ${esc(st.name)}</td>${a.questions.map((q,i)=>`<td><input aria-label="${esc(st.name)} question ${q.no}" id="m-${st.id}-${i}" type="number" min="0" max="${q.max}" step="0.5" value="${vals[i]??''}" style="width:64px;padding:7px;border:1px solid var(--line);border-radius:7px" /></td>`).join('')}<td><b>${total.toFixed(1)}</b></td></tr>`}).join('')}</tbody></table></div><div class="sectiontabs" style="margin-top:12px"><button onclick="saveMarks(false)">Save progress</button><button onclick="saveMarks(true)">Save and calculate results</button></div><div class="muted small">Blank values remain incomplete. For this demonstration, all students are included in the register.</div></section>`}
function saveMarks(confirm){const a=getA();if(!a)return;const errors=[];db.students.forEach(st=>{const vals=a.questions.map((q,i)=>{const el=document.getElementById(`m-${st.id}-${i}`);const raw=el?.value.trim()??'';if(raw==='')return null;const v=Number(raw);if(!Number.isFinite(v)||v<0||v>q.max){errors.push(`${st.name} Q${q.no} must be 0–${q.max}`);return null}return v});a.marks[st.id]=vals});if(errors.length){toast(errors[0]);return}const complete=db.students.every(st=>(a.marks[st.id]||[]).length===a.questions.length&&(a.marks[st.id]||[]).every(v=>v!==null&&v!==undefined));a.status=confirm&&complete?'Results confirmed':'Marks in progress';db.activity.unshift({teacher:1,event:complete?'Results confirmed':'Marks saved',detail:a.title,date:'Just now'});save();if(confirm&&complete){page='results';render();toast('Results calculated from the saved marks.')}else{render();toast('Marks saved. You can return to finish later.')}}
function resultsPage(){const a=getA();if(!a)return '';const avgpct=classAverage(a);const topics=topicScores(a);const rank=db.students.map(s=>({s,score:studentScore(a,s),pct:100*studentScore(a,s)/a.max})).sort((x,y)=>y.pct-x.pct);return `<div class="detailtop"><button class="backbtn" onclick="goBack()">← Back</button>${pill(a.status,a.status==='Results confirmed'?'green':'amber')}</div>${pageHead('ASSESSMENT REPORT',esc(a.title),'Class results, question analysis and topic-level signals.',`<button class="btn secondary" onclick="exportCSV(${a.id})">Export CSV</button>`)}<div class="metrics">${metric('Class average',avgpct.toFixed(0)+'%','Across the register','↗')}${metric('Students recorded',db.students.filter(s=>{const vals=a.marks[s.id]||[];return vals.length===a.questions.length&&vals.every(v=>v!==null&&v!==undefined&&v!=='')}).length,`of ${db.students.length} students`,'♙')}${metric('Questions',a.questions.length,'Mapped to topics','▤')}${metric('Max marks',a.max,'Per assessment','✓')}</div>${chart(Object.entries(topics).map(([label,value])=>({label,value})))}<section class="card" style="margin-top:13px"><div class="sectionhead"><h2>Student results</h2><button class="btn secondary small" onclick="navigate('students')">Student histories</button></div><div class="tablewrap"><table><thead><tr><th>Student</th><th>Score</th><th>%</th><th>Review</th></tr></thead><tbody>${rank.map(x=>`<tr><td><button style="background:transparent;color:var(--navy);font-weight:800;padding:0" onclick="openStudent(${x.s.id})">${x.s.roll}. ${esc(x.s.name)}</button></td><td>${x.score.toFixed(1)}/${a.max}</td><td>${x.pct.toFixed(0)}%</td><td>${x.pct<50?pill('Review','red'):x.pct<70?pill('Monitor','amber'):pill('On track','green')}</td></tr>`).join('')}</tbody></table></div><div class="notice">Student signals are for teacher review. They do not diagnose ability, and a single assessment should not be treated as a persistent weakness.</div></section>`}
function studentsPage(){let q='';return `${pageHead(role==='principal'?'SCHOOL ROSTER':'MY CLASS','Students','Open a student profile to review assessment history, topic trends and support actions.')}<input class="search" id="studentSearch" placeholder="Search student name or roll…" oninput="filterStudents(this.value)"><section class="card"><div id="studentRows">${studentRows(db.students)}</div></section>`}function studentRows(arr){return arr.map(s=>{const a=latestAssessment();const score=a?studentScore(a,s):0;const percent=a?100*score/a.max:0;return `<div class="listrow"><div class="avatar">${s.roll}</div><div class="grow"><b>${esc(s.name)}</b><p>${s.admission} · Class ${s.className} · Latest ${percent.toFixed(0)}%</p></div><button class="btn secondary small" onclick="openStudent(${s.id})">Profile</button></div>`}).join('')}function filterStudents(q){document.getElementById('studentRows').innerHTML=studentRows(db.students.filter(s=>(s.name+' '+s.roll+' '+s.admission).toLowerCase().includes(q.toLowerCase())))}function openStudent(id){selectedStudent=id;previousPage=page;navigate('student',{student:id})}
function studentPage(){const s=db.students.find(x=>x.id===selectedStudent)||db.students[0];const history=db.assessments.filter(a=>a.status==='Results confirmed').map(a=>({a,score:studentScore(a,s),pct:100*studentScore(a,s)/a.max}));const latest=history[history.length-1];let perTopic={};TOPICS.forEach(t=>{const series=history.map(h=>({title:h.a.title,value:topicScores(h.a,s.id)[t]})).filter(x=>x.value!==undefined);if(series.length)perTopic[t]=series});const latestTopics=Object.entries(topicScores(latest?.a||latestAssessment(),s.id));return `<div class="detailtop"><button class="backbtn" onclick="goBack()">← Back to students</button></div>${pageHead('STUDENT PROFILE',esc(s.name),`Roll ${s.roll} · ${s.admission} · Class ${s.className}`)}<section class="card"><div class="studentbig"><div class="avatar">${s.roll}</div><div class="grow"><b>${esc(s.name)}</b><p class="muted small">Assessment history and topic-level evidence</p></div><div class="scorebig">${latest?latest.pct.toFixed(0)+'%':'—'}</div></div><div class="muted small" style="margin-top:6px">Latest confirmed assessment · ${latest?esc(latest.a.title):'No confirmed result'}</div></section><section class="card" style="margin-top:12px"><h2>Topic signals</h2>${latestTopics.map(([t,v])=>`<div class="listrow"><div class="grow"><b>${esc(t)}</b><p>${v.toFixed(0)}% latest evidence</p><div class="bartrack"><div class="barfill ${v<50?'low':''}" style="width:${pct(v)}%"></div></div></div>${pill(v<50?'Review':v<70?'Monitor':'On track',v<50?'red':v<70?'amber':'green')}</div>`).join('')}<div class="notice">A persistent gap should be confirmed across comparable assessments and reviewed against the student's work.</div></section><section class="card" style="margin-top:12px"><h2>Assessment history</h2>${history.map(h=>`<div class="listrow"><div class="grow"><b>${esc(h.a.title)}</b><p>${esc(h.a.date)} · ${h.score.toFixed(1)} / ${h.a.max}</p></div>${pill(h.pct.toFixed(0)+'%',h.pct<50?'red':h.pct<70?'amber':'green')}</div>`).join('')}<button class="btn" style="margin-top:12px" onclick="selectedTopic='${latestTopics.sort((a,b)=>a[1]-b[1])[0]?.[0]||'Fractions'}';navigate('practice',{student:${s.id}})">Prepare targeted practice →</button></section>`}
function gapsPage(){const list=gaps();const plans=db.interventions;return `${pageHead(role==='principal'?'STUDENT SUPPORT OVERVIEW':'TEACHER ACTIONS','Learning gaps','Evidence-based prompts for targeted revision. Use student history and teacher judgement before assigning support.')}<div class="metrics">${metric('Students to review',new Set(list.map(x=>x.student.id)).size,'Latest assessment signals','♙')}${metric('Topic signals',list.length,'Not a diagnosis','⌁')}${metric('Practice plans',plans.length,'Created in demo','✓')}${metric('Completed plans',plans.filter(p=>p.status==='Completed').length,'Follow-up tracked','↗')}</div><section class="card"><div class="sectionhead"><h2>Who may need me?</h2><span class="muted small">Latest confirmed results</span></div>${list.length?list.slice(0,20).map(x=>`<div class="listrow"><div class="avatar">${x.student.roll}</div><div class="grow"><b>${esc(x.student.name)}</b><p>${esc(x.topic)} · ${x.value.toFixed(0)}% in ${esc(x.assessment)}</p></div><button class="btn secondary small" onclick="selectedTopic='${x.topic}';selectedStudent=${x.student.id};previousPage='gaps';navigate('practice',{student:${x.student.id},topic:'${x.topic}'})">Create practice</button></div>`).join(''):'<div class="empty">No current topic flags. Enter marks and confirm an assessment to refresh the signals.</div>'}</section><section class="card" style="margin-top:12px"><div class="sectionhead"><h2>Support plan history</h2><span class="muted small">Demo</span></div>${plans.length?plans.map((p,i)=>`<div class="listrow"><div class="avatar">✓</div><div class="grow"><b>${esc(db.students.find(s=>s.id===p.student)?.name||'Student')} · ${esc(p.topic)}</b><p>${esc(p.created)} · ${p.status}</p></div>${pill(p.status,p.status==='Completed'?'green':'amber')}<button class="btn secondary small" onclick="completePlan(${i})">${p.status==='Completed'?'Done':'Complete'}</button></div>`).join(''):'<div class="empty">Practice plans created from a student profile will appear here.</div>'}</section>`}
function practicePage(){const s=db.students.find(x=>x.id===selectedStudent)||db.students[0];const qs=[question(selectedTopic,1),question(selectedTopic,2),question(selectedTopic,3)];return `<div class="detailtop"><button class="backbtn" onclick="goBack()">← Back</button></div>${pageHead('TARGETED REVISION','Practice worksheet',`${esc(s.name)} · Topic: ${esc(selectedTopic)}`)}<section class="card"><div class="eyebrow">TEACHER-REVIEWED PRACTICE</div><h2>Let's strengthen ${esc(selectedTopic)}</h2><p class="muted small">Short practice based on the latest recorded topic signal. Review and adapt before giving it to the student.</p>${qs.map((q,i)=>`<div class="listrow" style="align-items:flex-start"><div class="avatar">${i+1}</div><div class="grow"><b>${esc(q)}</b><div style="height:30px"></div></div></div>`).join('')}<div class="field"><label>Teacher note (optional)</label><textarea id="practiceNote" placeholder="What should the student focus on?"></textarea></div><button class="btn" onclick="savePractice(${s.id},'${selectedTopic}')">Save support plan</button><button class="btn secondary" onclick="createRetest('${selectedTopic}')">Create retest</button></section>`}function savePractice(s,t){db.interventions.unshift({student:s,topic:t,status:'Planned',created:new Date().toLocaleDateString(),note:document.getElementById('practiceNote')?.value||''});db.activity.unshift({teacher:1,event:'Practice plan created',detail:db.students.find(x=>x.id===s)?.name+' · '+t,date:'Just now'});save();toast('Practice plan saved');navigate('gaps')}function completePlan(i){db.interventions[i].status='Completed';save();render();toast('Support plan updated')}function createRetest(t){const a={id:Math.max(0,...db.assessments.map(x=>x.id))+1,title:'Retest — '+t,kind:'Retest',date:new Date().toISOString().slice(0,10),status:'Draft',max:10,teacher:1,questions:[1,2,3,4,5].map((n)=>({id:n,no:n,topic:t,prompt:question(t,n),max:2})),marks:{}};db.assessments.push(a);save();selectedAssessment=a.id;previousPage='practice';navigate('paper',{assessment:a.id});toast('Retest prepared')}
function messagesPage(){const list=gaps().slice(0,15);return `${pageHead('FAMILY COMMUNICATION','Parent messages','Review a supportive message draft before copying it to your preferred messaging app. Nothing is sent automatically.')}<div class="notice warn">This demo does not send WhatsApp messages. Review the message and school policy before sharing any student information.</div><div class="stack">${list.map(x=>{const msg=`Dear Parent/Guardian, ${x.student.name} is practising ${x.topic} in Mathematics. The latest class assessment suggests that a little extra practice may help. We will review mistakes in class and provide a short activity. Please encourage practice at home. Thank you, Demo High School.`;return `<section class="card"><div class="sectionhead"><h2>${esc(x.student.name)}</h2>${pill(x.topic,'amber')}</div><p class="muted small">${x.value.toFixed(0)}% topic score · Teacher review required</p><textarea id="msg-${x.student.id}-${x.topic}" style="width:100%;min-height:120px;padding:11px;border:1px solid var(--line);border-radius:10px;font:12px/1.5 inherit">${esc(msg)}</textarea><div class="sectiontabs" style="margin-top:9px"><button onclick="copyDraft('msg-${x.student.id}-${x.topic}')">Copy message</button><button onclick="markMessageReviewed(${x.student.id},'${x.topic}')">Mark reviewed</button></div></section>`}).join('')||'<div class="empty">No current messages to draft. Review learning gaps after entering results.</div>'}</div>`}function copyDraft(id){const el=document.getElementById(id);if(!el)return;el.select();try{document.execCommand('copy');toast('Message selected for copying')}catch(e){toast('Select the message and copy it manually')}}function markMessageReviewed(s,t){db.messages.unshift({student:s,topic:t,status:'Reviewed'});save();toast('Marked reviewed. No message was sent.')}
function teachersPage(){const all=db.assessments;return `${pageHead('SCHOOL OPERATIONS','Teacher profiles','Understand assessment workload, student progress, remaining learning gaps and the support teachers may need.')}<div class="metrics">${metric('Teacher profiles',TEACHERS.length,'Fictional staff directory','♧')}${metric('Assessment records',all.length,'Across the local demo','▤')}${metric('Support review','Context first','No teacher leaderboard','✓')}${metric('Live staff data','Not connected','Illustrative prototype','i')}</div><div class="teachergrid">${TEACHERS.map(t=>{const count=all.filter(a=>a.teacher===t.id).length;return `<section class="teacherbox"><div class="rowtop"><div class="avatar">${t.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><div class="grow"><b>${esc(t.name)}</b><p>${esc(t.subject)} · Classes ${esc(t.classes)}</p></div>${pill(count+' assessments')}</div><div class="progress"><div class="progressline"><span>Illustrative work-completion indicator</span><b>${t.completion}%</b></div><div class="bartrack"><div class="barfill" style="width:${t.completion}%"></div></div></div><div class="listrow"><div class="grow"><b>Recent activity</b><p>${esc(t.activity)}</p></div></div><button class="btn secondary small" onclick="teacherDetail(${t.id})">Open full profile →</button></section>`}).join('')}</div><div class="notice warn">Names, completion indicators and staff activity are fictional sample data. Do not use the indicators as formal staff ratings.</div><section class="card"><h2>How a principal should use this view</h2><div class="listrow"><div class="grow"><b>Accountability</b><p>See assessment work, marking and follow-up tasks that may need attention.</p></div></div><div class="listrow"><div class="grow"><b>Student outcomes</b><p>Review learning evidence over time, not one low score or one class average.</p></div></div><div class="listrow"><div class="grow"><b>Support planning</b><p>Discuss attendance, syllabus coverage, class context, resources and training with teachers.</p></div></div></section>`}function teacherDetail(id){const t=TEACHERS.find(x=>x.id===id);previousPage='teachers';page='teacher-detail';selectedTeacher=id;render()}let selectedTeacher=1;function teacherDetailPage(){const t=TEACHERS.find(x=>x.id===selectedTeacher);const assigned=db.assessments.filter(a=>a.teacher===t.id);const latest=assigned[assigned.length-1];const classAvg=latest?classAverage(latest):0;const followups=t.id===1?6:t.id===2?4:t.id===3?7:3;const pending=t.id===1?1:t.id===2?2:t.id===3?1:3;return `<div class="detailtop"><button class="backbtn" onclick="goBack()">← Back to teacher profiles</button></div>${pageHead('TEACHER PROFILE',esc(t.name),`${esc(t.subject)} · Classes ${esc(t.classes)} · Fictional demo staff record`)}<div class="metrics">${metric('Assessments',assigned.length,'Linked demo records','▤')}${metric('Work completion',t.completion+'%','Illustrative only','✓')}${metric('Latest class result',latest?Math.round(classAvg)+'%':'—','Not a teacher-effectiveness score','↗')}${metric('Follow-up signals',followups,'Sample review queue','⌁')}</div><div class="stack two-col"><section class="card"><h2>1. Classes and subjects</h2><div class="listrow"><div class="grow"><b>${esc(t.subject)}</b><p>Assigned classes: ${esc(t.classes)}</p></div></div><h2 style="margin-top:15px">2. Is assessment work up to date?</h2><div class="listrow"><div class="grow"><b>${assigned.length} linked assessment records</b><p>${esc(t.activity)}</p></div>${pill(pending+' items to verify','amber')}</div><p class="muted small">Pending indicators must be checked against deadlines and school policy before escalation.</p></section><section class="card"><h2>3. Student progress evidence</h2><div class="scorebig">${latest?Math.round(classAvg)+'%':'No result'}</div><p class="muted small">${latest?'Latest linked assessment: '+esc(latest.title):'No assessment assigned in sample data.'}</p><p>Compare topic-level evidence and each student with their own previous result. Similar syllabus coverage and paper difficulty matter.</p>${latest?`<button class="btn secondary small" onclick="openAssessment(${latest.id},'results')">Open results →</button>`:''}</section></div><div class="stack two-col" style="margin-top:13px"><section class="card"><h2>4. Which learning gaps remain?</h2><div class="listrow"><div class="grow"><b>Follow-up queue</b><p>${followups} fictional student signals require teacher review.</p></div></div><div class="listrow"><div class="grow"><b>Topic evidence</b><p>Use repeated low scores across questions and assessments to target reteaching; do not label students from one result.</p></div></div><button class="btn secondary small" onclick="navigate('gaps')">Open learning-gap queue →</button></section><section class="card"><h2>5. Does the teacher need support?</h2><div class="listrow"><div class="grow"><b>Attendance / missed lessons</b><p>Not connected. Check attendance and missed instruction first.</p></div></div><div class="listrow"><div class="grow"><b>Syllabus coverage / assessment fit</b><p>Confirm taught topics, assessment difficulty, class size and available learning time.</p></div></div><div class="listrow"><div class="grow"><b>Resources and coaching</b><p>Consider practice material, additional teaching time, training or timetable support.</p></div></div></section></div><section class="card" style="margin-top:13px"><h2>Assessment history</h2>${assigned.map(a=>`<div class="listrow"><div class="grow"><b>${esc(a.title)}</b><p>${esc(a.date)} · ${esc(a.status)}</p></div><button class="btn secondary small" onclick="openAssessment(${a.id},'results')">Open report</button></div>`).join('')||'<div class="empty">No assessments assigned in sample data.</div>'}<div class="notice warn">Low marks alone do not prove poor teaching. This profile is a support and review tool—not a surveillance score. All figures are fictional and not connected to live school records.</div></section>`}
function render(){navMarkup();const el=document.getElementById('content');const views={dashboard,assessments:assessmentsPage,create:createPage,students:studentsPage,gaps:gapsPage,messages:messagesPage,teachers:teachersPage,assessment:paperPage,paper:paperPage,marks:marksPage,results:resultsPage,student:studentPage,practice:practicePage,'teacher-detail':teacherDetailPage};el.innerHTML=(views[page]||dashboard)()+`<div class="footer">SchoolOS AI · Concept demonstration · Fictional sample data · No AI service or message delivery is active</div>`;document.title=(page==='dashboard'?(role==='principal'?'Principal':'Teacher'):'SchoolOS AI')+' · SchoolOS AI'}
window.addEventListener('popstate',()=>{page='dashboard';render()});render();
</script></body></html>
